<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vina Vásár</title>

<style>
body{
    font-family: Arial,sans-serif;
    text-align:center;
    margin-top:80px;
}

button{
    padding:12px 20px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    margin:10px;
}

.kek{background:#2196F3;}
.zold{background:#4CAF50;}
.szurke{background:#555;}

input{
    padding:10px;
    font-size:16px;
    width:300px;
}

#emailResz,
#osszegResz,
#koszonet{
    display:none;
}

#folytatas,
#veglegesites{
    position:fixed;
    left:20px;
    bottom:20px;
}

.kicsi{
    font-size:14px;
    color:#666;
}
</style>
</head>

<body>

<div id="kezdo">
    <button class="kek" onclick="emailKeres()">
        Kérek e-mailba blokkot
    </button>

    <button class="zold" onclick="nemKell()">
        Nem kérek blokkot
    </button>
</div>

<div id="emailResz">
    <h3>Add meg az e-mail címed</h3>

    <input type="email" id="email" placeholder="email@pelda.hu">

    <button id="folytatas" class="szurke" onclick="tovabbOsszeghez()">
        Tovább
    </button>
</div>

<div id="osszegResz">
    <h3>A kasszás írja be a végösszeget</h3>

    <input type="number" id="osszeg" placeholder="Végösszeg (Ft)">

    <button id="veglegesites" class="szurke" onclick="kuldes()">
        Küldés
    </button>
</div>

<div id="koszonet">
    <h2>Köszönjük vásárlását!</h2>
    <p id="szoveg" class="kicsi"></p>
</div>

<script>

let email = "";
let osszeg = "";

function emailKeres(){
    document.getElementById("kezdo").style.display="none";
    document.getElementById("emailResz").style.display="block";
}

function tovabbOsszeghez(){
    email = document.getElementById("email").value;

    if(email.trim() === ""){
        alert("Adj meg egy e-mail címet!");
        return;
    }

    document.getElementById("emailResz").style.display="none";
    document.getElementById("osszegResz").style.display="block";
}

function nemKell(){
    document.getElementById("kezdo").style.display="none";
    document.getElementById("koszonet").style.display="block";
    document.getElementById("szoveg").innerHTML="";

    setTimeout(ujrakezd,10000);
}

function nevEmailbol(email){
    let nev = email.split("@")[0];

    nev = nev.replace(/[._-]/g," ");

    return nev
        .split(" ")
        .map(s => s.charAt(0).toUpperCase() + s.slice(1))
        .join(" ");
}

function kuldes(){

    osszeg = document.getElementById("osszeg").value;

    if(osszeg.trim() === ""){
        alert("Add meg a végösszeget!");
        return;
    }

    let nev = nevEmailbol(email);

    let targy = "Köszönjük a vásárlást";

    let uzenet =
        "Köszönjük, " + nev + ", hogy vásároltál!\n\n" +
        "Költés: " + osszeg + " Ft\n\n; +
        "üdv.: Vina Vásár.kft";

    window.location.href =
        "mailto:" + email +
        "?subject=" + encodeURIComponent(targy) +
        "&body=" + encodeURIComponent(uzenet);

    document.getElementById("osszegResz").style.display="none";
    document.getElementById("koszonet").style.display="block";

    document.getElementById("szoveg").innerHTML =
        "Köszönjük!<br>Költés: " + osszeg + " Ft";

    setTimeout(ujrakezd,25000);
}

function ujrakezd(){
    document.getElementById("email").value="";
    document.getElementById("osszeg").value="";

    document.getElementById("kezdo").style.display="block";
    document.getElementById("emailResz").style.display="none";
    document.getElementById("osszegResz").style.display="none";
    document.getElementById("koszonet").style.display="none";
}

</script>

</body>
</html>
