<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gyerek pénztárca</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f8ff;
    text-align:center;
    margin:20px;
}
    .money-card{

    animation:
    appear 0.8s ease,
    float 4s ease-in-out infinite,
    glow 3s infinite;

}


.money-card::after{

    content:"🪙  ✨  🪙  ✨";

    position:absolute;

    bottom:-20px;

    left:0;

    width:100%;

    font-size:25px;

    opacity:.7;

    animation:
    coins 5s linear infinite;

}


@keyframes coins{

0%{

transform:translateY(40px);

opacity:0;

}


30%{

opacity:1;

}


100%{

transform:translateY(-130px);

opacity:0;

}

}



@keyframes glow{


0%,100%{

box-shadow:
0 10px 25px rgba(0,0,0,.25);

}


50%{

box-shadow:
0 10px 35px rgba(33,150,243,.7);

}


}



.money-card:hover{

transform:scale(1.05);

}


.info{

background:white;

display:inline-block;

padding:12px 25px;

border-radius:20px;

box-shadow:
0 5px 15px rgba(0,0,0,.15);

animation:
appear 1s;

    }
    


select{

    font-size:22px;
    padding:10px;
    border-radius:10px;

}


h1{

    font-size:45px;
    color:#1976d2;

}


.money-card{

    margin:40px auto;

    width:330px;

    height:110px;

    border-radius:25px;

    background:
    linear-gradient(
    135deg,
    #66bb6a,
    #29b6f6
    );

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    overflow:hidden;


    box-shadow:
    0 10px 25px rgba(0,0,0,.25);


    animation:
    appear 1s ease,
    float 4s ease-in-out infinite;

}



.money-card::before{

    content:"";

    position:absolute;

    width:60px;

    height:200%;

    background:
    rgba(255,255,255,.5);


    transform:rotate(25deg);

    left:-100px;


    animation:
    light 5s infinite;

}



.money{

    color:white;

    font-size:45px;

    font-weight:bold;

    z-index:2;

    text-shadow:
    0 3px 5px black;


    animation:
    moneyShow 1.5s;

}



@keyframes appear{

from{

transform:scale(.3);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}


@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

}



@keyframes light{

0%{

left:-100px;

}

60%{

left:400px;

}

100%{

left:400px;

}

}



@keyframes moneyShow{

0%{

transform:scale(0);

}

70%{

transform:scale(1.3);

}

100%{

transform:scale(1);

}

}



.info{

font-size:25px;

color:#555;

}



</style>

</head>


<body>


<h1>💰 Saját pénzem</h1>


<select id="child" onchange="showMoney()">

<option value="">Válassz!</option>

<option value="Vili">Vili</option>

<option value="Nándi">Nándi</option>

</select>



<div id="content">


</div>



<script>


let moneyData={

Vili:{
money:200,
currency:"Ft"
},

Nándi:{
money:500,
currency:"Ft"
}

};



function showMoney(){


let name=document.getElementById("child").value;

let content=document.getElementById("content");



if(name===""){

content.innerHTML="";

return;

}



let amount=moneyData[name].money;



content.innerHTML=`

<h1>${name}</h1>


<div class="money-card">

<div class="money">

${amount} ${moneyData[name].currency}

</div>

</div>


<div class="info">

Ez a saját pénzed 💚

</div>

`;

}
let gyuriPassword = 
localStorage.getItem("gyuriPassword") || "Répapa";


function openGyuri(){

let password = prompt("Gyuri jelszó:");

if(password===gyuriPassword){

showAdmin();

}else{

alert("Hibás jelszó!");

}

}



function showAdmin(){

document.getElementById("content").innerHTML=`

<h1>👨‍👧 Gyuri kezelő</h1>


<select id="editChild">

<option value="Vili">Vili</option>

<option value="Nándi">Nándi</option>

</select>


<br><br>


<input 
id="newMoney"
type="number"
placeholder="Új összeg">


<select id="newCurrency">

<option>Ft</option>

<option>€</option>

<option>$</option>

</select>


<br><br>


<button onclick="saveMoney()">

Mentés

</button>


<br><br>


<button onclick="changePassword()">

🔑 Jelszó módosítás

</button>

`;

}




function saveMoney(){


let child=
document.getElementById("editChild").value;


let money=
document.getElementById("newMoney").value;


let currency=
document.getElementById("newCurrency").value;



moneyData[child].money=
Number(money);


moneyData[child].currency=
currency;



localStorage.setItem(
child+"Money",
money
);


localStorage.setItem(
child+"Currency",
currency
);



alert("Elmentve!");

}




function changePassword(){


let newPass=
prompt("Új Gyuri jelszó:");



if(newPass){

gyuriPassword=newPass;


localStorage.setItem(
"gyuriPassword",
newPass
);


alert("Jelszó megváltoztatva!");

}


}



// adatok visszatöltése

function loadData(){


["Vili","Nándi"].forEach(function(child){


let m=
localStorage.getItem(child+"Money");


let c=
localStorage.getItem(child+"Currency");



if(m){

moneyData[child].money=
Number(m);

}


if(c){

moneyData[child].currency=c;

}


});


}


loadData();

    function animateMoney(element, start, end, currency){

let current=start;

let speed=20;

let difference=end-start;


let step=difference/50;


let timer=setInterval(function(){


current+=step;


if(
(step>0 && current>=end) ||
(step<0 && current<=end)
){

current=end;

clearInterval(timer);

}


element.innerHTML=
Math.floor(current)+" "+currency;


},speed);


}



function showMoney(){


let name=document.getElementById("child").value;

let content=document.getElementById("content");



if(name===""){

content.innerHTML="";

return;

}



let amount=moneyData[name].money;

let currency=moneyData[name].currency;



content.innerHTML=`

<h1>${name}</h1>


<div class="money-card">

<div class="money" id="animatedMoney">

0 ${currency}

</div>

</div>


<div class="info">

💚 Ez a saját pénzed

</div>

`;



let moneyBox=
document.getElementById("animatedMoney");



animateMoney(
moneyBox,
0,
amount,
currency
);


    }
    

</script>


</body>
</html>
