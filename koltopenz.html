<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gyerek pénztárca</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef6ff;
    text-align:center;
    margin:20px;
}


h1{
    color:#1976d2;
    font-size:42px;
}


select,input{
    font-size:20px;
    padding:10px;
    border-radius:12px;
}


button{
    font-size:20px;
    padding:12px 25px;
    border:none;
    border-radius:15px;
    cursor:pointer;
}


.blue{
    background:#2196f3;
    color:white;
}


.gray{
    background:#555;
    color:white;
}


.card{

    background:white;

    width:330px;

    margin:30px auto;

    padding:25px;

    border-radius:25px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.2);

}


.money-card{

    width:330px;

    height:120px;

    margin:30px auto;

    border-radius:25px;

    background:
    linear-gradient(
    135deg,
    #66bb6a,
    #2196f3
    );

    display:flex;

    justify-content:center;

    align-items:center;

    animation:float 4s infinite;

}


.money{

    color:white;

    font-size:45px;

    font-weight:bold;

    text-shadow:
    0 3px 5px black;

}


@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

}


</style>

</head>


<body>


<h1>💰 Saját pénzem</h1>


<select id="child" onchange="showMoney()">

<option value="">
Válassz!
</option>

<option value="Vili">
Vili
</option>

<option value="Nándi">
Nándi
</option>

</select>


<br><br>


<button class="gray" onclick="openGyuri()">

👨‍👧 Gyuri

</button>


<div id="content"></div>



<div id="gyuriLogin" class="card" style="display:none;">


<h2>Gyuri belépés</h2>


<input
id="password"
type="password"
placeholder="Jelszó">


<button onclick="eyePassword()">
👁️
</button>


<br><br>


<button class="blue" onclick="loginGyuri()">

Belépés

</button>


</div>



<script>


let gyuriPassword =
localStorage.getItem("gyuriPassword")
|| "Répapa";



let moneyData={

Vili:{
money:200,
currency:"Ft"
},

Nándi:{
money:500,
currency:"Ft"
}

};



function showMoney(){

let name=
document.getElementById("child").value;


let content=
document.getElementById("content");


if(name===""){

content.innerHTML="";

return;

}


content.innerHTML=`

<h1>${name}</h1>


<div class="money-card">

<div class="money">

${moneyData[name].money}
${moneyData[name].currency}

</div>

</div>


<p>
Csak megtekintés 👀
</p>

`;

}



function openGyuri(){

document.getElementById("gyuriLogin")
.style.display="block";

}



function eyePassword(){

let p=
document.getElementById("password");


p.type="text";


setTimeout(()=>{

p.type="password";

},4000);

}



function loginGyuri(){

let p=
document.getElementById("password").value;


if(p===gyuriPassword){

alert("Gyuri belépve");


}else{

alert("Hibás jelszó");

}

}
<div id="gyuriPanel" class="card" style="display:none;">

<h1>👨‍👧 Gyuri</h1>

<h2>Pénz beállítása</h2>


<select id="editChild">

<option value="Vili">
Vili
</option>

<option value="Nándi">
Nándi
</option>

</select>


<br><br>


<input
id="moneyInput"
type="number"
placeholder="Összeg">


<br><br>


<select id="currencyInput">

<option>
Euró €
</option>

<option>
Forint Ft
</option>

<option>
Dollár $
</option>

</select>


<br><br>


<button class="blue" onclick="saveMoney()">

💾 Mentés

</button>


<button class="gray" onclick="closePanel()">

Mégse

</button>


<br><br>


<button class="gray" onclick="changePassword()">

🔑 Jelszó módosítás

</button>


</div>



<script>


function loginGyuri(){

let p =
document.getElementById("password").value;


if(p===gyuriPassword){


document.getElementById("gyuriLogin")
.style.display="none";


document.getElementById("gyuriPanel")
.style.display="block";


}else{


alert("Hibás jelszó!");

}

}




function saveMoney(){


let child =
document.getElementById("editChild").value;


let money =
document.getElementById("moneyInput").value;


let currency =
document.getElementById("currencyInput").value;



moneyData[child].money =
Number(money);


moneyData[child].currency =
currency;



localStorage.setItem(
child+"Money",
money
);


localStorage.setItem(
child+"Currency",
currency
);



alert("Elmentve!");



}



function closePanel(){

document.getElementById("gyuriPanel")
.style.display="none";

}



function changePassword(){


let newPass =
prompt("Új jelszó:");



if(newPass){

gyuriPassword=newPass;


localStorage.setItem(
"gyuriPassword",
newPass
);


alert("Új jelszó mentve!");

}

}



function loadSavedMoney(){


["Vili","Nándi"].forEach(function(child){


let money =
localStorage.getItem(child+"Money");


let currency =
localStorage.getItem(child+"Currency");



if(money){

moneyData[child].money =
Number(money);

}


if(currency){

moneyData[child].currency =
currency;

}


});


}

<style>

.money-card{

    position:relative;

    overflow:hidden;

    animation:
    appear .8s ease,
    float 4s infinite;

}


.money-card::after{

    content:"🪙 ✨ 🪙 ✨";

    position:absolute;

    bottom:-10px;

    font-size:28px;

    animation:
    coins 4s infinite;

}



@keyframes coins{

0%{

transform:translateY(30px);

opacity:0;

}


50%{

opacity:1;

}


100%{

transform:translateY(-100px);

opacity:0;

}

}



@keyframes appear{

from{

transform:scale(.4);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}



</style>


<script>


function countMoney(element,start,end,currency){


let value=start;


let step=(end-start)/50;



let timer=setInterval(function(){


value+=step;



if(
(step>0 && value>=end) ||
(step<0 && value<=end)
){

value=end;

clearInterval(timer);

}



element.innerHTML=
Math.floor(value)+" "+currency;



},25);


}




function showMoney(){


let name=
document.getElementById("child").value;


let content=
document.getElementById("content");



if(name===""){

content.innerHTML="";

return;

}



let amount=
moneyData[name].money;


let currency=
moneyData[name].currency;



content.innerHTML=`

<h1>${name}</h1>


<div class="money-card">

<div class="money" id="moneyNumber">

0 ${currency}

</div>

</div>


<p>

💚 Ez a saját pénzed

</p>

`;



countMoney(

document.getElementById("moneyNumber"),

0,

amount,

currency

);


}




function saveMoney(){


let child =
document.getElementById("editChild").value;


let money =
Number(document.getElementById("moneyInput").value);


let currency =
document.getElementById("currencyInput").value;



moneyData[child].money=money;

moneyData[child].currency=currency;



localStorage.setItem(
child+"Money",
money
);


localStorage.setItem(
child+"Currency",
currency
);



alert("Elmentve!");


// ha éppen azt nézi a gyerek

if(document.getElementById("child").value===child){

showMoney();

}


}

<script>


function logoutGyuri(){

document.getElementById("gyuriPanel")
.style.display="none";


document.getElementById("gyuriLogin")
.style.display="block";


document.getElementById("password").value="";


alert("Kijelentkeztél.");

}


</script>


<br>


<button 
class="gray"
onclick="logoutGyuri()">

🚪 Kijelentkezés

</button>


</body>

</html>

    

loadSavedMoney();


</script>
    

    </script>
