<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gyerek pénztárca</title>

<style>
/* ide jön a kinézet */
</style>

</head>

<body>
    <body>

<h1>💰 Saját pénztárca</h1>


<!-- Gyerek választó -->

<select id="childSelect" onchange="showChildMoney()">

<option value="">
Válassz!
</option>

<option value="Vili">
Vili
</option>

<option value="Nándi">
Nándi
</option>

</select>


<br><br>


<!-- Gyuri belépés gomb -->

<button class="gray" onclick="openGyuriLogin()">

👨‍👧 Gyuri

</button>



<!-- Gyerek pénz megjelenítés -->

<div id="childContent"></div>




<!-- Gyuri belépő -->

<div id="gyuriLogin" class="card" style="display:none;">


<h2>Gyuri belépés</h2>


<input
id="gyuriPassword"
type="password"
placeholder="Jelszó">


<button onclick="showPassword()">

👁️

</button>


<br><br>


<button class="blue" onclick="loginGyuri()">

Belépés

</button>


</div>





<!-- Gyuri kezelőfelület -->

<div id="gyuriPanel" class="card" style="display:none;">


<h1>👨 Gyuri</h1>


<h2>Pénz beállítása</h2>



<select id="editChild">


<option value="Vili">
Vili
</option>


<option value="Nándi">
Nándi
</option>


</select>



<br><br>



<input
id="moneyInput"
type="number"
placeholder="Összeg">



<br><br>



<select id="currencyInput">


<option>
Euró €
</option>


<option>
Forint Ft
</option>


<option>
Dollár $
</option>


</select>



<br><br>



<button class="blue" onclick="saveMoney()">

💾 Mentés

</button>



<button class="gray" onclick="closeGyuri()">

Mégse

</button>



<br><br>



<button class="gray" onclick="changePassword()">

🔑 Jelszó módosítás

</button>



    </div>
        

<!-- ide jönnek a gombok, menük, kártyák -->

<script>
    <script>

let gyuriPassword =
localStorage.getItem("gyuriPassword") || "Répapa";


let moneyData = {

Vili:{
    money:200,
    currency:"Forint Ft"
},

Nándi:{
    money:500,
    currency:"Euró €"
}

};



// mentett adatok betöltése

function loadData(){

["Vili","Nándi"].forEach(function(name){

let money =
localStorage.getItem(name+"Money");

let currency =
localStorage.getItem(name+"Currency");


if(money){

moneyData[name].money =
Number(money);

}


if(currency){

moneyData[name].currency =
currency;

}

});

}


loadData();




// gyerek pénz megmutatása

function showChildMoney(){

let name =
document.getElementById("childSelect").value;


let box =
document.getElementById("childContent");



if(name===""){

box.innerHTML="";

return;

}



box.innerHTML=`

<h1>${name}</h1>


<div class="money-card">

<div class="money" id="moneyNumber">

0 ${moneyData[name].currency}

</div>

</div>


<p>

👀 Csak megtekintés

</p>

`;



animateMoney(

document.getElementById("moneyNumber"),

0,

moneyData[name].money,

moneyData[name].currency

);


}





// lassú pénzszámolás

function animateMoney(element,start,end,currency){


let current=start;


let step=end/50;


let timer=setInterval(function(){


current+=step;



if(current>=end){

current=end;

clearInterval(timer);

}



element.innerHTML =
Math.floor(current)+" "+currency;



},30);


}





// Gyuri belépés

function openGyuriLogin(){

document.getElementById("gyuriLogin")
.style.display="block";

}





function showPassword(){

let input =
document.getElementById("gyuriPassword");


input.type="text";


setTimeout(function(){

input.type="password";

},4000);

}





function loginGyuri(){


let pass =
document.getElementById("gyuriPassword").value;



if(pass===gyuriPassword){


document.getElementById("gyuriLogin")
.style.display="none";


document.getElementById("gyuriPanel")
.style.display="block";


}else{


alert("Hibás jelszó!");

}


}

  function saveMoney(){

let child =
document.getElementById("editChild").value;


let money =
document.getElementById("moneyInput").value;


let currency =
document.getElementById("currencyInput").value;



moneyData[child].money =
Number(money);


moneyData[child].currency =
currency;



localStorage.setItem(
child+"Money",
money
);


localStorage.setItem(
child+"Currency",
currency
);



alert("Elmentve! 💾");



if(document.getElementById("childSelect").value===child){

showChildMoney();

}

}





function closeGyuri(){

document.getElementById("gyuriPanel")
.style.display="none";

}





function changePassword(){


let newPassword =
prompt("Új Gyuri jelszó:");



if(newPassword){


gyuriPassword=newPassword;


localStorage.setItem(
"gyuriPassword",
newPassword
);


alert("Jelszó megváltoztatva! 🔑");


}


}



</script>


</body>

</html>


/* ide jön a működés */

</script>

</body>
</html>
