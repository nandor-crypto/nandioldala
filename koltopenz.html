<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gyerek pénztárca</title>


<style>

body{

font-family:Arial,sans-serif;
background:#f4f8ff;
text-align:center;
margin:20px;

}



h1{

font-size:45px;
color:#1976d2;

}



select,
input{

font-size:22px;
padding:10px;
border-radius:10px;
border:1px solid #aaa;

}



button{

font-size:20px;
padding:10px 20px;
border:none;
border-radius:12px;
cursor:pointer;

}



.money-card{

margin:40px auto;

width:330px;
height:110px;

border-radius:25px;

background:
linear-gradient(
135deg,
#66bb6a,
#29b6f6
);


display:flex;

align-items:center;

justify-content:center;

position:relative;

overflow:hidden;


box-shadow:
0 10px 25px rgba(0,0,0,.25);


animation:
appear 1s ease,
float 4s ease-in-out infinite;


}




.money-card::before{

content:"";

position:absolute;

width:60px;

height:200%;

background:
rgba(255,255,255,.5);


transform:rotate(25deg);

left:-100px;


animation:
light 5s infinite;

}



.money{

color:white;

font-size:45px;

font-weight:bold;

z-index:2;

text-shadow:
0 3px 5px black;


animation:
moneyShow 1.5s;

}



.money-card::after{

content:"🪙 ✨ 🪙 ✨";

position:absolute;

bottom:-20px;

left:0;

width:100%;

font-size:25px;

opacity:.7;

animation:
coins 5s linear infinite;

}



.info{

background:white;

display:inline-block;

padding:12px 25px;

border-radius:20px;

font-size:25px;

color:#555;

box-shadow:
0 5px 15px rgba(0,0,0,.15);

}



.login-box{

background:white;

padding:25px;

border-radius:20px;

width:350px;

margin:30px auto;

box-shadow:
0 5px 20px rgba(0,0,0,.2);

}



.blue{

background:#2196f3;

color:white;

}



.green{

background:#a5d6a7;

}



.lightblue{

background:#90caf9;

}



.gray{

background:#aaa;

color:white;

}




@keyframes appear{

from{

transform:scale(.3);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}



@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

}



@keyframes light{

0%{

left:-100px;

}

60%{

left:400px;

}

100%{

left:400px;

}

}



@keyframes moneyShow{

0%{

transform:scale(0);

}

70%{

transform:scale(1.3);

}

100%{

transform:scale(1);

}

}



@keyframes coins{

0%{

transform:translateY(40px);

opacity:0;

}

30%{

opacity:1;

}

100%{

transform:translateY(-130px);

opacity:0;

}

}



</style>

</head>



<body>

<h4>itt látod és szerkestheted a gyerekek pénzét, ha a gyerekeknek akarod megmutatni <a target="_blank" href="gyerekpenz.html">Kattints ide!</a>

<h1>💰 Saját pénzem</h1>



<select id="child">

<option value="">Válassz!</option>

<option value="Vili">Vili</option>

<option value="Nándi">Nándi</option>

<option value="Gyuri">Gyuri</option>

</select>



<br><br>


<button class="blue" onclick="login()">

Bejelentkezés

</button>



<div id="content"></div>




<script>


let moneyData={


Vili:{

money:200,

currency:"Ft"

},


Nándi:{

money:500,

currency:"Ft"

}


};



let gyuriPassword =
localStorage.getItem("gyuriPassword")
||
"Répapa";





function login(){


let name=
document.getElementById("child").value;



if(name===""){

alert("Válassz profilt!");

return;

}



if(name==="Gyuri"){

showGyuriLogin();

return;

}



showMoney(name);


}



function showMoney(name){


let data=moneyData[name];


document.getElementById("content").innerHTML=`

<h1>${name}</h1>


<div class="money-card">

<div class="money">

${data.money} ${data.currency}

</div>

</div>


<div class="info">

💚 Ez a saját pénzed

</div>

`;


}



   // 2. RÉSZ


function showGyuriLogin(){


document.getElementById("content").innerHTML=`

<div class="login-box">

<h2>🔐 Gyuri belépés</h2>


<input 
id="gyuriPass"
type="password"
placeholder="Jelszó">


<button onclick="showPassword()">

👁️

</button>


<br><br>


<button class="blue" onclick="checkGyuri()">

Belépés

</button>


</div>

`;

}



function showPassword(){


let input=
document.getElementById("gyuriPass");


input.type="text";


setTimeout(function(){

input.type="password";

},4000);


}




function checkGyuri(){


let pass=
document.getElementById("gyuriPass").value;



if(pass===gyuriPassword){


showAdmin();


}else{


alert("Hibás jelszó!");

}


}




function showAdmin(){


document.getElementById("content").innerHTML=`

<div style="text-align:left">

<button onclick="changePassword()">

✏️

</button>

</div>


<h1>Gyuri</h1>


<h2>Válassz szerkesztést</h2>


<button class="lightblue"
onclick="editProfile('Nándi')">

Nándi

</button>


<button class="green"
onclick="editProfile('Vili')">

Vili

</button>


`;

}





function editProfile(name){


let data=moneyData[name];


document.getElementById("content").innerHTML=`

<h1>${name}</h1>



<input

id="newMoney"

type="number"

value="${data.money}">


<select id="newCurrency">


<option value="Ft">Forint Ft</option>

<option value="€">Euró €</option>

<option value="$">Dollár $</option>


</select>



<br><br>


<button class="blue"
onclick="saveProfile('${name}')">

Mentés

</button>



<button class="gray"
onclick="showAdmin()">

Mégse

</button>


`;



document.getElementById("newCurrency").value=
data.currency;


}






function saveProfile(name){



let amount=
Number(
document.getElementById("newMoney").value
);



let currency=
document.getElementById("newCurrency").value;



moneyData[name].money=
amount;


moneyData[name].currency=
currency;



localStorage.setItem(
name+"Money",
amount
);



localStorage.setItem(
name+"Currency",
currency
);



alert("Elmentve!");



showAdmin();


}






function changePassword(){



document.getElementById("content").innerHTML=`

<h2>🔑 Új Gyuri jelszó</h2>


<input

id="newPassword"

type="password"

placeholder="Új jelszó">



<br><br>


<button class="blue"
onclick="savePassword()">

Mentés

</button>


<button class="gray"
onclick="showAdmin()">

Mégse

</button>


`;



}






function savePassword(){



let pass=
document.getElementById("newPassword").value;



if(pass!=""){


gyuriPassword=pass;


localStorage.setItem(
"gyuriPassword",
pass
);



alert("Jelszó mentve!");



showAdmin();


}


}







function loadData(){



["Vili","Nándi"].forEach(function(name){



let money=
localStorage.getItem(name+"Money");



let currency=
localStorage.getItem(name+"Currency");




if(money!==null){


moneyData[name].money=
Number(money);


}



if(currency!==null){


moneyData[name].currency=
currency;


}



});



}





loadData();



</script>


</body>

</html>
