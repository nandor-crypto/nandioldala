<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamera HUD</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

/* Kamera háttér */
#camera {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    top: 0;
    left: 0;
    z-index: 1;
}

/* HUD réteg */
#hud {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
}


/* Középső célkereszt */
#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #888;
    font-size: 45px;
    font-weight: bold;
}


/* Fogaskerék gomb */
#settingsButton {
    position: absolute;
    right: 20px;
    top: 20px;

    width: 60px;
    height: 60px;

    border-radius: 50%;
    background: rgba(80,80,80,0.8);
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;

    opacity: 0;
    transition: 0.3s;

    pointer-events: auto;
    cursor: pointer;
}


/* Ha a jobb felső sarok fölé megy az egér */
body:hover #settingsButton {
    opacity: 1;
}


/* Menü */
#menu {

    position: absolute;

    right: 20px;
    top: 90px;

    width: 280px;

    background: rgba(40,40,40,0.85);

    border-radius: 20px;

    padding: 15px;

    display: none;

    pointer-events: auto;

    color:white;
}


/* Menü címe */
#menu h2 {

    text-align:center;
    margin-bottom:15px;
    font-size:20px;

}


/* Gombok tartója */
.options {

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;

}


/* Kör alakú kapcsolók */
.option {

    width:90px;
    height:90px;

    border-radius:50%;

    background:#777;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    color:white;

    cursor:pointer;

    transition:0.2s;

    text-align:center;

}


.option .icon {

    font-size:30px;

}


.option span {

    font-size:12px;
    margin-top:5px;

}


/* Bekapcsolt állapot */
.option.active {

    background:orange;

}


/* Halvány külső keret */
#screenFrame {

    position:absolute;

    width:100%;
    height:100%;

    border:3px solid rgba(220,220,220,0.35);

    display:none;

}


/* Infra piros fókuszkeret */
#infraFrame {

    position:absolute;

    width:70%;
    height:50%;

    left:15%;
    top:25%;

    border:5px solid red;

    display:none;

}


/* Függőleges detektor alap */
#detector {

    position:absolute;

    right:60px;

    top:25%;

    height:50%;

    width:8px;

    background:rgba(255,255,255,0.5);

    display:none;

}


/* Háromszögek */
.triangle {

    position:absolute;

    left:-12px;

    width:0;
    height:0;

    border-left:12px solid transparent;
    border-right:12px solid transparent;

}


#triangleTop {

    top:-15px;

    border-bottom:20px solid red;

}


#triangleBottom {

    bottom:-15px;

    border-top:20px solid red;

}


</style>

</head>

<body>

<!-- Kamera kép -->
<video id="camera" autoplay playsinline></video>


<!-- HUD elemek -->
<div id="hud">


    <!-- Középső plusz -->
    <div id="crosshair">+</div>


    <!-- Beállítás gomb -->
    <div id="settingsButton">
        ⚙️
    </div>



    <!-- Menü -->
    <div id="menu">

        <h2>Beállítások</h2>


        <div class="options">


            <!-- Infra keret -->
            <div class="option" id="infraButton">

                <div class="icon">
                    ‼️
                </div>

                <span>
                    Infra keret
                </span>

            </div>



            <!-- Függőleges detektor -->
            <div class="option" id="detectorButton">

                <div class="icon">
                    🔺🔻
                </div>

                <span>
                    Függőleges detektor
                </span>

            </div>




            <!-- Veszély mód -->
            <div class="option" id="dangerButton">

                <div class="icon">
                    ☣️⚠️
                </div>

                <span>
                    Veszély
                </span>

            </div>




            <!-- Halvány keret -->
            <div class="option" id="frameButton">

                <div class="icon">
                    ⏹️
                </div>

                <span>
                    Keret
                </span>

            </div>




            <!-- Lövés -->
            <div class="option" id="shootButton">

                <div class="icon">
                    🔫
                </div>

                <span>
                    Lövés
                </span>

            </div>



        </div>


    </div>



    <!-- Effektek -->


    <!-- Infra fókuszkeret -->
    <div id="infraFrame"></div>



    <!-- Külső halvány keret -->
    <div id="screenFrame"></div>




    <!-- Függőleges detektor -->
    <div id="detector">


        <div id="triangleTop" class="triangle"></div>


        <div id="triangleBottom" class="triangle"></div>


    </div>



</div>



<!-- Hangok helye -->
<audio id="shotSound" src="shot.mp3"></audio>

<audio id="reloadSound" src="reload.mp3"></audio>

<audio id="sirenSound" src="siren.mp3"></audio>



    
<script>


// Kamera indítása

const camera = document.getElementById("camera");


navigator.mediaDevices.getUserMedia({

    video: {
        facingMode: "environment"
    },

    audio:false

})

.then(stream => {

    camera.srcObject = stream;

})

.catch(error => {

    alert("A kamera nem érhető el: " + error);

});





// Menü elemek

const settingsButton = document.getElementById("settingsButton");

const menu = document.getElementById("menu");



// Menü nyitás

settingsButton.addEventListener("click",()=>{


    if(menu.style.display === "block"){

        menu.style.display="none";

    }

    else{

        menu.style.display="block";

    }


});







// Gombok

const infraButton =
document.getElementById("infraButton");


const detectorButton =
document.getElementById("detectorButton");


const dangerButton =
document.getElementById("dangerButton");


const frameButton =
document.getElementById("frameButton");


const shootButton =
document.getElementById("shootButton");






// Effektek

const infraFrame =
document.getElementById("infraFrame");


const screenFrame =
document.getElementById("screenFrame");


const detector =
document.getElementById("detector");





// Kapcsoló segédfüggvény

function toggleButton(button){

    button.classList.toggle("active");

}






// INFRA KERET

infraButton.addEventListener("click",()=>{


    toggleButton(infraButton);


    if(infraButton.classList.contains("active")){


        infraFrame.style.display="block";


    }

    else{


        infraFrame.style.display="none";


    }


});









// HALVÁNY KERET

frameButton.addEventListener("click",()=>{


    toggleButton(frameButton);


    if(frameButton.classList.contains("active")){


        screenFrame.style.display="block";


    }

    else{


        screenFrame.style.display="none";


    }


});









// FÜGGŐLEGES DETEKTOR

detectorButton.addEventListener("click",()=>{


    toggleButton(detectorButton);



    if(detectorButton.classList.contains("active")){


        detector.style.display="block";


        startDetector();


    }

    else{


        detector.style.display="none";


        stopDetector();


    }



});






// Detektor mozgás


let detectorTimer;


function startDetector(){


    detectorTimer=setInterval(()=>{


        let value=Math.random()*120;


        detector.style.transform=
        "translateY("+value+"px)";


    },800);



}



function stopDetector(){


    clearInterval(detectorTimer);


    detector.style.transform="translateY(0)";


}


// ===============================
// VESZÉLY MÓD
// ===============================


const hud = document.getElementById("hud");


// Figyelmeztető felirat létrehozása

const warningText = document.createElement("div");

warningText.innerHTML = "⚠️ VESZÉLY ⚠️";


warningText.style.position="absolute";
warningText.style.top="40px";
warningText.style.left="50%";
warningText.style.transform="translateX(-50%)";

warningText.style.color="red";
warningText.style.fontSize="35px";
warningText.style.fontWeight="bold";

warningText.style.display="none";


hud.appendChild(warningText);





// Piros villódzó réteg

const dangerFlash = document.createElement("div");


dangerFlash.style.position="absolute";
dangerFlash.style.left="0";
dangerFlash.style.top="0";

dangerFlash.style.width="100%";
dangerFlash.style.height="100%";

dangerFlash.style.border="25px solid red";

dangerFlash.style.display="none";

dangerFlash.style.pointerEvents="none";


hud.appendChild(dangerFlash);







let dangerActive=false;

let dangerInterval;






dangerButton.addEventListener("click",()=>{


    toggleButton(dangerButton);



    if(dangerButton.classList.contains("active")){


        dangerActive=true;


        startDanger();


    }

    else{


        dangerActive=false;


        stopDanger();


    }


});








function startDanger(){


    dangerInterval=setInterval(()=>{


        if(!dangerActive) return;



        warningText.style.display="block";


        dangerFlash.style.display="block";



        dangerFlash.animate(

            [
                {
                    opacity:0.2
                },

                {
                    opacity:1
                },

                {
                    opacity:0.2
                }

            ],

            {

                duration:800,
                iterations:3

            }


        );



        let siren =
        document.getElementById("sirenSound");


        siren.currentTime=0;

        siren.play().catch(()=>{});

        setTimeout(()=>{

            warningText.style.display="none";

            dangerFlash.style.display="none";


        },4000);

    },120000); // 2 perc


}

function stopDanger(){
 clearInterval(dangerInterval);
 warningText.style.display="none";
 dangerFlash.style.display="none";


}

// ===============================
// LÖVÉS FUNKCIÓ
// ===============================


const shotSound =
document.getElementById("shotSound");


const reloadSound =
document.getElementById("reloadSound");

shootButton.addEventListener("click",()=>{
 toggleButton(shootButton);

    shotSound.currentTime=0;


    shotSound.play().catch(()=>{});


    setTimeout(()=>{


        reloadSound.currentTime=0;

       reloadSound.play().catch(()=>{});


    },1200);


});

</script>


</body>

</html>
