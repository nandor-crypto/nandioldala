<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<title>Összekötős tanuló játék</title>


<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
text-align:center;
}


h1{
color:#0d47a1;
}


select,button{
font-size:18px;
padding:10px;
margin:8px;
}



#start{
background:#1976d2;
color:white;
border:0;
border-radius:8px;
cursor:pointer;
}



#jatekter{
display:none;
position:relative;
justify-content:center;
gap:80px;
margin-top:40px;
min-height:650px;
}



#vonalak{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
z-index:1;
pointer-events:none;
}



.oszlop{
width:350px;
z-index:2;
}



.gomb{
width:300px;
padding:12px;
margin:7px;
background:#2196f3;
color:white;
border:0;
border-radius:10px;
cursor:pointer;
position:relative;
z-index:3;
}



.gomb:hover{
background:#1565c0;
}



.kivalasztva{
background:#8cff8c!important;
color:black;
}



.par{
background:#66ff66!important;
color:black;
}



#ellenorzes{
display:none;
background:#43a047;
color:white;
border:0;
border-radius:8px;
cursor:pointer;
}

</style>

</head>


<body>


<h1>Összekötős tanuló játék</h1>


<select id="tema">

<option value="">
-- Válassz témát --
</option>


<option value="foci">
Labdarúgás játékszabályok
</option>


<option value="sejt">
Sejt alkotók és sejt folyamatok
</option>


</select>



<button id="start" onclick="inditas()">
Start
</button>



<div id="jatekter">


<svg id="vonalak"></svg>



<div class="oszlop">

<h2>Fogalmak</h2>

<div id="bal"></div>

</div>



<div class="oszlop">

<h2>Meghatározások</h2>

<div id="jobb"></div>

</div>


</div>



<button id="ellenorzes" onclick="ellenoriz()">
Ellenőrzés
</button>



<script>


let kapcsolatok=[];

let valasztottBal=null;

let valasztottJobb=null;

let jelenlegiTema="";



const adatok={



foci:{


bal:[

"Les",
"Szöglet",
"Büntető",
"Szabadrúgás",
"Bedobás",
"Sárga lap",
"Piros lap",
"VAR",
"Kapus",
"Hosszabbítás"

],


jobb:[

"Csak bizonyos körülmények között ítélhető meg.",

"Egy játékos közvetlenül is meghatározó szerepet játszhat benne.",

"Lehet egy szabálytalanság következménye.",

"Előfordulhat, hogy technológia segítségével vizsgálják felül.",

"Nem minden mérkőzésen fordul elő.",

"Gól közvetlenül is születhet belőle.",

"A játék újraindításának egyik módja.",

"A mérkőzés kimenetelére jelentős hatással lehet.",

"A játékvezető figyelmeztetést adhat érte.",

"A játékvezető kiállítást ítélhet miatta."

]

},



sejt:{


bal:[

"Fotoszintézis",
"Mitokondrium",
"Riboszóma",
"Sejtmag",
"Kloroplasztisz",
"Diffúzió",
"Ozmózis",
"Enzim",
"DNS",
"ATP"

],


jobb:[

"Fehérjeszintézisben vesz részt.",

"Közvetlenül kapcsolódik az energiatermeléshez.",

"Növényi sejtekben található, de állati sejtekben nem.",

"Áteresztő hártyával összefüggő folyamat vagy szerkezet.",

"Örökítőanyaggal kapcsolatos.",

"Kémiai reakciókat gyorsít.",

"A sejtlégzéshez kapcsolódik.",

"A növények szervesanyag-előállításában játszik szerepet.",

"A sejt működését irányító központi szerkezet.",

"Anyagok részecskék mozgásával történő terjedése."

]

};

  <script>


function inditas(){


jelenlegiTema=document.getElementById("tema").value;


if(jelenlegiTema==""){

alert("Válassz témát!");

return;

}


document.getElementById("jatekter").style.display="flex";

document.getElementById("ellenorzes").style.display="inline-block";


kapcsolatok=[];


let bal=document.getElementById("bal");

let jobb=document.getElementById("jobb");


bal.innerHTML="";

jobb.innerHTML="";


adatok[jelenlegiTema].bal.forEach(szoveg=>{


let g=document.createElement("button");

g.className="gomb";

g.innerHTML=szoveg;


g.onclick=function(){

valasztottBal=g;

g.classList.add("kivalasztva");

kapcsolas();

};


bal.appendChild(g);


});





adatok[jelenlegiTema].jobb.forEach(szoveg=>{


let g=document.createElement("button");

g.className="gomb";

g.innerHTML=szoveg;


g.onclick=function(){

valasztottJobb=g;

g.classList.add("kivalasztva");

kapcsolas();

};


jobb.appendChild(g);


});


rajzol();

}





function kapcsolas(){


if(valasztottBal && valasztottJobb){



let regiBal=kapcsolatok.find(
p=>p.bal===valasztottBal
);


let regiJobb=kapcsolatok.find(
p=>p.jobb===valasztottJobb
);



if(regiBal){

kapcsolatok=kapcsolatok.filter(
p=>p!==regiBal
);

regiBal.bal.classList.remove("par");
regiBal.jobb.classList.remove("par");

}



if(regiJobb){

kapcsolatok=kapcsolatok.filter(
p=>p!==regiJobb
);

regiJobb.bal.classList.remove("par");
regiJobb.jobb.classList.remove("par");

}



kapcsolatok.push({

bal:valasztottBal,

jobb:valasztottJobb

});


valasztottBal.classList.add("par");

valasztottJobb.classList.add("par");


valasztottBal.classList.remove("kivalasztva");

valasztottJobb.classList.remove("kivalasztva");



valasztottBal=null;

valasztottJobb=null;


rajzol();


}

}






function rajzol(){


let svg=document.getElementById("vonalak");


svg.innerHTML="";


let terulet=svg.getBoundingClientRect();



kapcsolatok.forEach(p=>{


let bal=p.bal.getBoundingClientRect();

let jobb=p.jobb.getBoundingClientRect();



let vonal=document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);



vonal.setAttribute(
"x1",
bal.right-terulet.left
);


vonal.setAttribute(
"y1",
bal.top+bal.height/2-terulet.top
);


vonal.setAttribute(
"x2",
jobb.left-terulet.left
);


vonal.setAttribute(
"y2",
jobb.top+jobb.height/2-terulet.top
);



vonal.setAttribute(
"stroke",
"#00aa00"
);



vonal.setAttribute(
"stroke-width",
"5"
);



vonal.setAttribute(
"stroke-linecap",
"round"
);



svg.appendChild(vonal);


});


}







const megoldasok={


foci:{


"Les":
"Csak bizonyos körülmények között ítélhető meg.",

"Szöglet":
"Gól közvetlenül is születhet belőle.",

"Büntető":
"Lehet egy szabálytalanság következménye.",

"Szabadrúgás":
"A játék újraindításának egyik módja.",

"Bedobás":
"A játék újraindításának egyik módja.",

"Sárga lap":
"A játékvezető figyelmeztetést adhat érte.",

"Piros lap":
"A játékvezető kiállítást ítélhet miatta.",

"VAR":
"Előfordulhat, hogy technológia segítségével vizsgálják felül.",

"Kapus":
"Egy játékos közvetlenül is meghatározó szerepet játszhat benne.",

"Hosszabbítás":
"Nem minden mérkőzésen fordul elő."

},



sejt:{


"Fotoszintézis":
"A növények szervesanyag-előállításában játszik szerepet.",

"Mitokondrium":
"A sejtlégzéshez kapcsolódik.",

"Riboszóma":
"Fehérjeszintézisben vesz részt.",

"Sejtmag":
"A sejt működését irányító központi szerkezet.",

"Kloroplasztisz":
"Növényi sejtekben található, de állati sejtekben nem.",

"Diffúzió":
"Anyagok részecskék mozgásával történő terjedése.",

"Ozmózis":
"Áteresztő hártyával összefüggő folyamat vagy szerkezet.",

"Enzim":
"Kémiai reakciókat gyorsít.",

"DNS":
"Örökítőanyaggal kapcsolatos.",

"ATP":
"Közvetlenül kapcsolódik az energiatermeléshez."

}

};






function ellenoriz(){


let jo=0;


kapcsolatok.forEach(p=>{


let helyes=
megoldasok[jelenlegiTema][p.bal.innerHTML];



if(helyes===p.jobb.innerHTML){


p.bal.style.background="green";

p.jobb.style.background="green";


jo++;

}

else{


p.bal.style.background="red";

p.jobb.style.background="red";


}


});



alert(
"Pontszám: "+jo+" / "+kapcsolatok.length
);


}




window.addEventListener(
"resize",
rajzol
);


</script>


</body>

</html>
