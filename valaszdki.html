<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Összekötős tanuló játék</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
text-align:center;
}

h1{
color:#0d47a1;
}

select,button{
font-size:18px;
padding:10px;
margin:8px;
}


#start{
background:#1976d2;
color:white;
border:0;
border-radius:8px;
cursor:pointer;
}


#jatekter{
display:none;
position:relative;
justify-content:center;
gap:80px;
margin-top:40px;
}


#vonalak{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;
}


.oszlop{
width:350px;
}


.gomb{
width:300px;
padding:12px;
margin:7px;
background:#2196f3;
color:white;
border:0;
border-radius:10px;
cursor:pointer;
}


.gomb:hover{
background:#1565c0;
}


.kivalasztva{
background:#8cff8c!important;
color:black;
}


.par{
background:#66ff66!important;
color:black;
}


#ellenorzes{
display:none;
background:#43a047;
color:white;
border:0;
border-radius:8px;
cursor:pointer;
}


</style>

</head>

<body>


<h1>Összekötős tanuló játék</h1>


<select id="tema">

<option value="">-- Válassz témát --</option>

<option value="foci">
Labdarúgás játékszabályok
</option>

<option value="sejt">
Sejt alkotók és sejt folyamatok
</option>

</select>


<button id="start" onclick="inditas()">
Start
</button>



<div id="jatekter">


<svg id="vonalak"></svg>


<div class="oszlop">

<h2>Fogalmak</h2>

<div id="bal"></div>

</div>



<div class="oszlop">

<h2>Meghatározások</h2>

<div id="jobb"></div>

</div>


</div>



<button id="ellenorzes" onclick="ellenoriz()">
Ellenőrzés
</button>



<script>


let kapcsolatok=[];

let valasztottBal=null;
let valasztottJobb=null;

let jelenlegiTema="";



const adatok={


foci:{

bal:[
"Les",
"Szöglet",
"Büntető",
"Szabadrúgás",
"Bedobás",
"Sárga lap",
"Piros lap",
"VAR",
"Kapus",
"Hosszabbítás"
],


jobb:[

"Csak bizonyos körülmények között ítélhető meg.",

"Egy játékos közvetlenül is meghatározó szerepet játszhat benne.",

"Lehet egy szabálytalanság következménye.",

"Előfordulhat, hogy technológia segítségével vizsgálják felül.",

"Nem minden mérkőzésen fordul elő.",

"Gól közvetlenül is születhet belőle.",

"A játék újraindításának egyik módja.",

"A mérkőzés kimenetelére jelentős hatással lehet."

]

},



sejt:{


bal:[

"Fotoszintézis",
"Mitokondrium",
"Riboszóma",
"Sejtmag",
"Kloroplasztisz",
"Diffúzió",
"Ozmózis",
"Enzim",
"DNS",
"ATP"

],


jobb:[

"Fehérjeszintézisben vesz részt.",

"Közvetlenül kapcsolódik az energiatermeléshez.",

"Növényi sejtekben található, de állati sejtekben nem.",

"Áteresztő hártyával összefüggő folyamat vagy szerkezet.",

"Örökítőanyaggal kapcsolatos.",

"Kémiai reakciókat gyorsít.",

"A sejtlégzéshez kapcsolódik.",

"A növények szervesanyag-előállításában játszik szerepet."

]

}

};





function inditas(){


jelenlegiTema=document.getElementById("tema").value;


if(jelenlegiTema==""){

alert("Válassz témát!");

return;

}


document.getElementById("jatekter").style.display="flex";

document.getElementById("ellenorzes").style.display="inline-block";


kapcsolatok=[];


let bal=document.getElementById("bal");
let jobb=document.getElementById("jobb");


bal.innerHTML="";
jobb.innerHTML="";


adatok[jelenlegiTema].bal.forEach(szoveg=>{


let g=document.createElement("button");

g.className="gomb";

g.innerHTML=szoveg;


g.onclick=function(){

valasztottBal=g;

g.classList.add("kivalasztva");

kapcsolas();

};


bal.appendChild(g);


});



adatok[jelenlegiTema].jobb.forEach(szoveg=>{


let g=document.createElement("button");

g.className="gomb";

g.innerHTML=szoveg;


g.onclick=function(){

valasztottJobb=g;

g.classList.add("kivalasztva");

kapcsolas();

};


jobb.appendChild(g);


});


}
// ===== 2. RÉSZ =====

// Kapcsolatok kezelése

function kapcsolas(){

if(valasztottBal && valasztottJobb){


let letezik=kapcsolatok.find(
p=>p.bal===valasztottBal && p.jobb===valasztottJobb
);


// ha már létezik, töröljük

if(letezik){

kapcsolatok=kapcsolatok.filter(
p=>p!==letezik
);


valasztottBal.classList.remove("par");
valasztottJobb.classList.remove("par");

}


// ha nincs, létrehozzuk

else{


kapcsolatok.push({

bal:valasztottBal,

jobb:valasztottJobb

});


valasztottBal.classList.add("par");
valasztottJobb.classList.add("par");


}


valasztottBal.classList.remove("kivalasztva");
valasztottJobb.classList.remove("kivalasztva");


rajzol();


valasztottBal=null;
valasztottJobb=null;


}

}



// vonalak rajzolása

function rajzol(){


let svg=document.getElementById("vonalak");


svg.innerHTML="";


let terulet=svg.getBoundingClientRect();



kapcsolatok.forEach(p=>{


let bal=p.bal.getBoundingClientRect();

let jobb=p.jobb.getBoundingClientRect();



let vonal=document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);



vonal.setAttribute(
"x1",
bal.right-terulet.left
);


vonal.setAttribute(
"y1",
bal.top+bal.height/2-terulet.top
);



vonal.setAttribute(
"x2",
jobb.left-terulet.left
);


vonal.setAttribute(
"y2",
jobb.top+jobb.height/2-terulet.top
);



vonal.setAttribute(
"stroke",
"#00aa00"
);



vonal.setAttribute(
"stroke-width",
"5"
);



svg.appendChild(vonal);


});


}




// helyes válaszok

const megoldasok={


foci:{


"Les":
"Csak bizonyos körülmények között ítélhető meg.",


"Szöglet":
"Gól közvetlenül is születhet belőle.",


"Büntető":
"Lehet egy szabálytalanság következménye.",


"Szabadrúgás":
"A játék újraindításának egyik módja.",


"VAR":
"Előfordulhat, hogy technológia segítségével vizsgálják felül.",


"Kapus":
"Egy játékos közvetlenül is meghatározó szerepet játszhat benne."

},



sejt:{


"Riboszóma":
"Fehérjeszintézisben vesz részt.",


"ATP":
"Közvetlenül kapcsolódik az energiatermeléshez.",


"Kloroplasztisz":
"Növényi sejtekben található, de állati sejtekben nem.",


"Ozmózis":
"Áteresztő hártyával összefüggő folyamat vagy szerkezet.",


"DNS":
"Örökítőanyaggal kapcsolatos.",


"Enzim":
"Kémiai reakciókat gyorsít.",


"Mitokondrium":
"A sejtlégzéshez kapcsolódik.",


"Fotoszintézis":
"A növények szervesanyag-előállításában játszik szerepet."

}

};




// ellenőrzés

function ellenoriz(){


let jo=0;


kapcsolatok.forEach(p=>{


let helyes=
megoldasok[jelenlegiTema][p.bal.innerHTML];



if(helyes===p.jobb.innerHTML){


p.bal.style.background="green";

p.jobb.style.background="green";


jo++;


}

else{


p.bal.style.background="red";

p.jobb.style.background="red";


}


});



alert(
"Pontszám: "+jo+" / "+kapcsolatok.length
);


}



// ablakméretezésnél újrarajzol

window.addEventListener(
"resize",
rajzol
);
