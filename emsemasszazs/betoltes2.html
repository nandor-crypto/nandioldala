
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imádkozó kezek</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 38%, #34445b 0%, #1b2638 48%, #0b111d 100%);
  font-family: Arial, sans-serif;
}

.scene {
  width: min(94vw, 540px);
  text-align: center;
}

svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

h1 {
  color: #f0e4d7;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 4px;
  margin: 0 0 12px;
}

.skin {
  fill: url(#skin);
  stroke: #a96148;
  stroke-width: 1.1;
  stroke-linejoin: round;
}

.nail {
  fill: url(#nail);
  stroke: #bc806a;
  stroke-width: .7;
}

.crease {
  fill: none;
  stroke: #ad6c53;
  stroke-width: 1.3;
  stroke-linecap: round;
  opacity: .55;
}

.finger {
  transform-box: view-box;
  transform-origin: 200px 280px;
  animation-duration: 6s;
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
}

.f1 { animation-name: finger1; }
.f2 { animation-name: finger2; }
.f3 { animation-name: finger3; }
.f4 { animation-name: finger4; }

@keyframes finger1 {
  0%, 4%, 15%, 100% { transform: rotate(0deg) translateY(0); }
  8%, 12% { transform: rotate(-9deg) translateY(-3px); }
}
@keyframes finger2 {
  0%, 16%, 27%, 100% { transform: rotate(0deg) translateY(0); }
  19%, 24% { transform: rotate(-7deg) translateY(-4px); }
}
@keyframes finger3 {
  0%, 28%, 39%, 100% { transform: rotate(0deg) translateY(0); }
  31%, 36% { transform: rotate(6deg) translateY(-4px); }
}
@keyframes finger4 {
  0%, 40%, 51%, 100% { transform: rotate(0deg) translateY(0); }
  43%, 48% { transform: rotate(10deg) translateY(-3px); }
}

.wrist {
  animation: breathe 3s ease-in-out infinite;
  transform-origin: 200px 350px;
}
@keyframes breathe {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(2px); }
}

.page-loader {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: grid;
  place-items: center;
  background: #fff;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.25s ease, visibility 0.25s ease;
}

.page-loader.is-visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.page-loader img {
  display: block;
  width: min(220px, 60vw);
  height: auto;
}
</style>
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-label="Betöltés">
  <img src="https://media.tenor.com/_62bXB8gnzoAAAAj/loading.gif" alt="Betöltés...">
</div>
<div class="scene">

    <!-- Körömfények -->
    <path d="M194 70 Q201 65 207 72"
          fill="none" stroke="#ffdfc5" stroke-width="2" opacity=".7"/>
    <path d="M160 83 Q166 78 171 85"
          fill="none" stroke="#ffdfc5" stroke-width="2" opacity=".7"/>
    <path d="M237 90 Q243 86 247 92"
          fill="none" stroke="#ffdfc5" stroke-width="2" opacity=".7"/>
  </svg>
</div>
<script>
  const pageLoader = document.getElementById("page-loader");
  const loaderTimeout = window.setTimeout(function () {
    pageLoader.classList.add("is-visible");
  }, 1500);

  window.addEventListener("load", function () {
    window.clearTimeout(loaderTimeout);
    pageLoader.classList.remove("is-visible");
  });
</script>
</body>
</html>
