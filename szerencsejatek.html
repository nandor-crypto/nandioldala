<!DOCTYPE html>
<html lang="hu">
<head>
    <p id="eredmeny" style="font-size: 1.5em;"></p>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vina szerencse játék</title>
</head>
<style>
    body {
        background-color: grey;
    }
    h1 {
        background-color: blue;
        border-radius: 5px;
        shadow-box: 2px 5px 5px 5px;
    }
    h4{
        background-color: #cacaca;
        border-radius: 5px;
        
    
</style>
<body>

<h1>Vina szerencse játék</h1>
<h4>Zsákba macska</h4>
    <h5>
    színek:
</h5>
    <h5>
        kék: főnyeremény
    </h5>
    <h5>
        zöld: egyéb nyeremény 
    </h5>
    <h5>
        piros: nem nyertél
    </h5>

<input type="text" id="kod" placeholder="Írd be a 4 betűt és 4 számot">
<button onclick="ellenoriz()">Ellenőrzés</button>

<p id="eredmeny"></p>
    
<script>
function ellenoriz() {
    let kod = document.getElementById("kod").value.toLowerCase().trim();
    let eredmeny = document.getElementById("eredmeny");

    if (kod === "kjha0937") {
        eredmeny.textContent = "Nyertél egy extra jegyet!";
    } 
    else if (kod === "hgnd7284") {
        eredmeny.textContent = "Nyertél egy plüssöt!";
    } 
    else {
        eredmeny.textContent = "Ön nem nyert semmit.";
    }
    if (kod === "kjha0937") {
    eredmeny.innerHTML = "<h3 style='color:blue'>Nyertél egy extra jegyet!</h3>";
}
else if (kod === "hgnd7284") {
    eredmeny.innerHTML = "<h3 style='color:green'>Nyertél egy plüssöt!</h3>";
}
else {
    eredmeny.innerHTML = "<h3 style='color:red'>Ön nem nyert semmit.</h3>";
}
}
</script>

</body>
</html>
