<style>
body {
    margin: 0;
    overflow: hidden;
    background: #f7f7f7;
    font-family: Arial;
}
#textUnder { text-align: center;
     margin-top: 10px;
      font-size: 18px; 
      color: #444;
       font-family: Arial; }

/* GAME */
#game {
    position: relative;
    width: 100vw;
    height: 300px;
    border-bottom: 4px solid #333;
    overflow: hidden;
}

/* DINO */
#dino {
    position: absolute;
    left: 50px;
    bottom: 0;
    font-size: 40px;
}

/* SCORE */
#score {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 24px;
}

/* GAME OVER */
#gameOver {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 100px;
    font-size: 40px;
    display: none;
}

/* BUTTONS */
#jumpBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #2196f3;
    color: white;
    border: none;
    font-size: 22px;
}

#restartBtn {
    display: none;
    position: fixed;
    left: 50%;
    top: 220px;
    transform: translateX(-50%);
    width: 220px;
    height: 60px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 22px;
}

/* CACTUS */
.cactus {
    position: absolute;
    bottom: 0;
}
</style>

<script>

const dino = document.getElementById("dino");
const game = document.getElementById("game");
const scoreEl = document.getElementById("score");
const gameOverEl = document.getElementById("gameOver");
const restartBtn = document.getElementById("restartBtn");
const jumpBtn = document.getElementById("jumpBtn");

let jumping = false;
let gameOver = false;
let score = 0;

/* JUMP */
function jump() {
    if (jumping || gameOver) return;

    jumping = true;
    let pos = 0;

    const up = setInterval(() => {
        if (pos >= 120) {
            clearInterval(up);

            const down = setInterval(() => {
                if (pos <= 0) {
                    clearInterval(down);
                    jumping = false;
                } else {
                    pos -= 5;
                    dino.style.bottom = pos + "px";
                }
            }, 20);

        } else {
            pos += 5;
            dino.style.bottom = pos + "px";
        }
    }, 20);
}

jumpBtn.onclick = jump;
document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp") jump();
});

/* RESTART */
restartBtn.onclick = () => location.reload();

/* COLLISION */
function isCollision(a, b) {
    return !(
        a.right < b.left ||
        a.left > b.right ||
        a.bottom < b.top ||
        a.top > b.bottom
    );
}

/* CACTUS */
function createCactus() {
    if (gameOver) return;

    const cactus = document.createElement("div");
    cactus.classList.add("cactus");
    game.appendChild(cactus);

    const type = Math.floor(Math.random() * 3);

    if (type === 0) {
        cactus.style.width = "25px";
        cactus.style.height = "60px";
        cactus.style.background = "green";
    } else if (type === 1) {
        cactus.style.width = "50px";
        cactus.style.height = "30px";
        cactus.style.background = "darkgreen";
    } else {
        cactus.style.width = "30px";
        cactus.style.height = "80px";
        cactus.style.background = "limegreen";
    }

    let left = window.innerWidth;
    cactus.style.left = left + "px";

    const move = setInterval(() => {

        if (gameOver) {
            clearInterval(move);
            return;
        }

        left -= 6;
        cactus.style.left = left + "px";

        const dinoRect = dino.getBoundingClientRect();
        const cactusRect = cactus.getBoundingClientRect();

        if (isCollision(dinoRect, cactusRect)) {
            gameOver = true;
            gameOverEl.innerHTML = "VÉGE! Pontszám: " + score;
            gameOverEl.style.display = "block";
            restartBtn.style.display = "block";
            clearInterval(move);
        }

        if (left < -50) {
            cactus.remove();
            clearInterval(move);
            score++;
            scoreEl.textContent = score;
        }

    }, 20);

    setTimeout(createCactus, Math.random() * 1200 + 800);
}

createCactus();

</script>
