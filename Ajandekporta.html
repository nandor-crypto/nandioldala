<!DOCTYPE html>
<html lang="hu">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<meta charset="UTF-8">
<title>Ajánék leső</title>

<style>
.tab-menu {
    display: flex;
    border-bottom: 2px solid #ccc;
}

.tab-button {
    padding: 10px 20px;
    cursor: pointer;
    background: white;
    border: none;
    border-bottom: 3px solid transparent;
    font-size: 16px;
}
body {
    background-color:#F0E68C ;
}

.tab-button.active {
    background: #e0e0e0;
    border-bottom-color: #0078d7;
}

.tab-content {
    display: none;
    padding: 20px 0;
}
 @media screen and (max-width: 600px) {

      /* Ide tehetsz még más mobil stílust is, pl: */
      body {
        font-size: 18px;
      }
    }

.tab-content.active {
    display: block;
}
</style>
</head>

<body>
    <h4>Ki vagy?</h4>
        <div class="tab-menu">
    <button class="tab-button active" onclick="openTab('info', this)">Apa</button>
    <button class="tab-button" onclick="openTab('media', this)">Vili</button>
    <button class="tab-button" onclick="openTab('gmail', this)">Anya</button>
</div>

<div id="info" class="tab-content active">
    <h1>Apa ajándékai</h1>
</div>

<div id="media" class="tab-content">
    <h1>Vili ajándékai</h1>
</div>

<div id="gmail" class="tab-content">
    <h1>Anya ajándékai</h1>
    <h2>
        <a target="_self" href="Ajandekanya1.html"> Nyitsd ki az első ajándékod </a>
    </h2>
</div>
</body>
<script>
function openTab(tabId, button) {
    document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
    });

    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
    });

    document.getElementById(tabId).classList.add('active');
    button.classList.add('active');
}
</script>

</body>
</html>
