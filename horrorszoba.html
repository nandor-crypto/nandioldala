<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <style>
        .villog {
            animation: villogas 1s infinite;
        }

        @keyframes villogas {
            0%, 50% {
                opacity: 1;
            }
            50.01%, 100% {
                opacity: 0;
            }
        }
        h1 {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center; /* vízszintesen középre */
            align-items: center; 
            color: #ffbbb2;
            font-size: 80px/* függőlegesen középre */
        }
    
    @media screen and (max-width: 600px) {
/* Ide tehetsz még más mobil stílust is, pl: */
      body {
        font-size: 18px;
      }
        }
      body {
        background-color:red;
      }
    </style>
</head>
<body>

<h1 class="villog">Gyere Kerepesre a Horror házba!</h1>

</body>
</html>
