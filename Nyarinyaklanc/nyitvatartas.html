<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyári nyaklánc Nyitvatartás</title>

    <style>
        body {
            background-color: #ccc;
            font-family: Arial, sans-serif;
        }

        h1,
        h2 {
            text-align: center;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 70px);
            gap: 45px;
            justify-content: center;
        }

        .day {
            width: 70px;
            height: 110px;
            border: 4px solid #4d4c4c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
        }


        .today {
            border: 5px solid blue;
        }

        .status {
            font-size: 22px;
            margin-top: 3px;
        }

        .label {
            font-size: 11px;
            text-align: center;
            margin-top: 2px;
        }

        .status {
            font-size: 30px;
        }

        /*@media screen and (max-width: 600px) {

            /* Ide tehetsz még más mobil stílust is, pl: */
            body {
                font-size: 15px;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>

<body>

    <h1>Nyitvatartás</h1>
    <h2>Itt láthatod, hogy nyitva van-e.</h2>

    <div class="calendar" id="calendar"></div>
    <h3>
        15:00-30 és 07:00 között
    </h3>



    <script>
        const calendar = document.getElementById("calendar");
        const today = new Date().getDate();

        // Biztosan nyitva
        const nyitva = [5, 6, 7, 8, 9, 10];

        // Valószínűleg nyitva
        const valoszinuleg = [11, 31, 23, 24, 14,];
        // És autómatikusan nincs nyitva az üres napokon
        /*for (let i = 11; i <= 12; i++) {
            valoszinuleg.push(i);
        }
        for (let i = 26; i <= 29; i++) {
            valoszinuleg.push(i);
        }
        for (let i = 17; i <= 20; i++) {
            valoszinuleg.push(i);
        }*/


        for (let day = 1; day <= 31; day++) {

            const div = document.createElement("div");
            div.className = "day";

            if (day === today) {
                div.classList.add("today");
                calendar.style.gap = "15px";
            }

            /*if (day === today + 1) {
                div.style.marginLeft = "2.4px";
            }*/

            div.innerHTML = `<div><strong>${day}</strong></div>`;

            if (day < today) {
                div.innerHTML += `
        <div class="status">🗓</div>
        <div class="label">Elmúlt nap</div>
    `;
            } else if (nyitva.includes(day)) {
                div.innerHTML += `
            <div class="status">✅</div>
            <div class="label">Nyitva</div>
        `;
            } else if (valoszinuleg.includes(day)) {
                div.innerHTML += `
        <div class="status" style="color: gold;">&#9888;</div>
        <div class="label">valószínüleg nyitva lesz</div>
        `;

            } else {
                div.innerHTML += `
            <div class="status">🚫</div>
            <div class="label">Nincs nyitva</div>
        `;
            }

            calendar.appendChild(div);
        }
    </script>

</body>

</html>
