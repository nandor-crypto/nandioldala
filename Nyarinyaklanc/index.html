<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyári nyaklánc</title>

    <link rel="icon" type="image/png" href="./kagylol.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0, 0, 0, 0.35),
                        rgba(0, 0, 0, 0.35)),
                url("./summer2png.png");

            background-size: cover;
            background-position: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #ff9800;
            margin-bottom: 25px;
            font-size: 2rem;
        }

        p {
            color: #444;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .gomb {
            display: inline-block;
            background: linear-gradient(135deg, #29b6f6, #0288d1);
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 14px;
            font-size: 1.4rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .gomb:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(2, 136, 209, 0.4);
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .gomb {
                width: 100%;
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Ez a weboldal bármikor frissülhet!</h1>

        <p>
            Köszönjük, hogy meglátogattad oldalunkat.
            Várjuk véleményedet és értékelésedet!
        </p>

        <a class="gomb" href="ertekelj.html">
            ⭐ Értékelj!
        </a>
    </div>

</body>

</html>
