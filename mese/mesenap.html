<!DOCTYPE html>
<html lang="hu">
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
<meta charset="UTF-8">
<title>MeseNaptár</title>
<style>
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 70px);
    gap: 5px;
  }
  body {
    background-color: #ccc;
  }


  .day {
    width: 70px;
    height: 70px;
    border: 4px solid #4d4c4c;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }

  .today {
    border: 5px solid blue;
  }

  .tv {
    font-size: 20px;
    margin-top: 3px;
  }
</style>
</head>
<body>
    <h1>
        Mesenapok
    </h1>

<div class="calendar" id="calendar"></div>
<h2>
  Itt láthatod a mesenapokat
</h2>

<script>
  const calendar = document.getElementById("calendar");
  const today = new Date().getDate();

  for (let day = 1; day <= 31; day++) {
    /* a for (let day = 1; day <= 31; day++) a 31 írd át!*/
    const div = document.createElement("div");
    div.className = "day";

    if (day === today) {
      div.classList.add("today");
    }

    div.innerHTML = `<div>${day}</div>`;

    // Minden második nap TV ikon
    if ([20, 22, 24, 26, 28, 30].includes(day)) {
      div.innerHTML += `<div class="tv">📺</div>`;
    }

    calendar.appendChild(div);
  }
</script>

</body>
</html>
