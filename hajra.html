<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gyerek pénztárca</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f8ff;
    text-align:center;
    margin:20px;
}
    .money-card{

    animation:
    appear 0.8s ease,
    float 4s ease-in-out infinite,
    glow 3s infinite;

}


.money-card::after{

    content:"🪙  ✨  🪙  ✨";

    position:absolute;

    bottom:-20px;

    left:0;

    width:100%;

    font-size:25px;

    opacity:.7;

    animation:
    coins 5s linear infinite;

}


@keyframes coins{

0%{

transform:translateY(40px);

opacity:0;

}


30%{

opacity:1;

}


100%{

transform:translateY(-130px);

opacity:0;

}

}



@keyframes glow{


0%,100%{

box-shadow:
0 10px 25px rgba(0,0,0,.25);

}


50%{

box-shadow:
0 10px 35px rgba(33,150,243,.7);

}


}



.money-card:hover{

transform:scale(1.05);

}


.info{

background:white;

display:inline-block;

padding:12px 25px;

border-radius:20px;

box-shadow:
0 5px 15px rgba(0,0,0,.15);

animation:
appear 1s;

}
    


select{

    font-size:22px;
    padding:10px;
    border-radius:10px;

}


h1{

    font-size:45px;
    color:#1976d2;

}


.money-card{

    margin:40px auto;

    width:330px;

    height:110px;

    border-radius:25px;

    background:
    linear-gradient(
    135deg,
    #66bb6a,
    #29b6f6
    );

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    overflow:hidden;


    box-shadow:
    0 10px 25px rgba(0,0,0,.25);


    animation:
    appear 1s ease,
    float 4s ease-in-out infinite;

}



.money-card::before{

    content:"";

    position:absolute;

    width:60px;

    height:200%;

    background:
    rgba(255,255,255,.5);


    transform:rotate(25deg);

    left:-100px;


    animation:
    light 5s infinite;

}



.money{

    color:white;

    font-size:45px;

    font-weight:bold;

    z-index:2;

    text-shadow:
    0 3px 5px black;


    animation:
    moneyShow 1.5s;

}



@keyframes appear{

from{

transform:scale(.3);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}


@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

}



@keyframes light{

0%{

left:-100px;

}

60%{

left:400px;

}

100%{

left:400px;

}

}



@keyframes moneyShow{

0%{

transform:scale(0);

}

70%{

transform:scale(1.3);

}

100%{

transform:scale(1);

}

}



.info{

font-size:25px;

color:#555;

}



</style>

</head>


<body>
