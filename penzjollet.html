<!DOCTYPE html>
<html>
<head>
<style>
h3 {
  background-color: green;
  border-radius: 5px;
  border: 2px solid black;
}
  @media screen and (max-width: 600px) {

      /* Ide tehetsz még más mobil stílust is, pl: */
      body {
        font-size: 28px;
      }
  }
  h1 { 
    font-size: 90px;
  }
</style>
</head>

<body>

<select id="menu" onchange="mutatTartalom()">
  <option value="">Válassz!</option>
  <option value="szoveg1">Fogmosás</option>
  <option value="szoveg2">Semmi édesség</option>
</select>

<div id="tartalom"></div>

<script>
function mutatTartalom() {
  let menu = document.getElementById("menu");
  let tartalom = document.getElementById("tartalom");

  if (menu.value == "szoveg1") {
    tartalom.innerHTML = "<h3>Ne felejts el fogat mosni!</h3>";
  } 
  else if (menu.value == "szoveg2") {
    tartalom.innerHTML = `
      <h1>Ha egy nap semmilyen édességet nem eszel</h1>
      <h2 style="color: orange;">
        Ha egy nap semmi édességet nem eszel,kapsz
      </h2>
    `;
  } 
  else {
    tartalom.innerHTML = "";
  }
}
</script>

</body>
</html>
