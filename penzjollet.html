<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

select {
    font-size: 22px;
    padding: 8px;
    margin-bottom: 20px;
}

h1 {
    font-size: 50px;
}

h2 {
    font-size: 32px;
}
    .card {
    position: relative;
    overflow: hidden;
    width: 320px;
    height: 70px;
    border-radius: 16px;
    background: #3f4652;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 600 18px sans-serif;
}

.card::after {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );
    transform: skewX(-20deg);
    animation: shine 2.0s infinite;
}

@keyframes shine {
    0%, 70% {
        left: -60%;
    }
    100% {
        left: 130%;
    }
    }

h3 {
    background-color: green;
    color: white;
    border: 2px solid black;
    border-radius: 5px;
    padding: 10px;
}

@media screen and (max-width: 600px) {
    body {
        font-size: 28px;
    }

    h1 {
        font-size: 32px;
    }

    h2 {
        font-size: 28px;
    }

    h3 {
        font-size: 28px;
    }

    select {
        width: 100%;
        font-size: 28px;
    }
}
</style>
</head>

<body>

<select id="menu" onchange="mutatTartalom()">
    <option value="">Válassz!</option>
    <option value="szoveg1">Fogmosás</option>
    <option value="szoveg2">Semmi édesség</option>
</select>

<div id="tartalom"></div>

<script>
function mutatTartalom() {
    let menu = document.getElementById("menu");
    let tartalom = document.getElementById("tartalom");

    if (menu.value == "szoveg1") {
        tartalom.innerHTML = `
            <h3>Ne felejts el fogat mosni!</h3>
            <p>A rendszeres fogmosás segít megőrizni a fogaid egészségét.</p>
        `;
    }
    else if (menu.value == "szoveg2") {
        tartalom.innerHTML = `
            <h1>Ha egy nap semmilyen édességet nem eszel</h1>
            <h2 style="color: orange;">
                Ha egy nap semmi édességet nem eszel, kapsz,</h2> <div class="card">
  <span>?--?Ft</span>
</div>
          
        `;
/*        if (menu.value == "val") {
        tartalom.innerHTML = `
    /*    <h1> Válassz egy kategóriát!</h1> */
            `;
    }
    else {
        tartalom.innerHTML = "";
    }
}
</script>

</body>
</html>
