<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egyéni Célok & Jegyzetek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 50%, #10b981 100%);
            min-height: 100vh;
        }

        .note-card {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 4px solid #34d399;
            border-radius: 24px;
           /* padding: 24px sm:padding: 32px; */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            margin-bottom: 32px;
        }

        .eye-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #0f172a;
            border: 2px solid #facc15;
            color: #ffffff;
            font-size: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, background-color 0.2s ease;
            z-index: 20;
        }

        .eye-btn:hover {
            transform: scale(1.1);
            background: #1e293b;
        }

        .masked-text {
            color: #0f172a;
            font-family: monospace;
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="py-10 px-4 sm:px-8 flex flex-col items-center">

    <div class="w-full max-w-4xl" id="cardsContainer">
        <!-- 10 kártya generálása Dinamikusan -->
    </div>

    <script>
        const cardsContainer = document.getElementById('cardsContainer');
        const cardCount = 10;

        // 10 különálló kártya létrehozása
        for (let i = 1; i <= cardCount; i++) {
            const card = document.createElement('div');
            card.className = 'note-card';
            card.id = `card-${i}`;

            card.innerHTML = `
                <button class="eye-btn" onclick="toggleCardMask(${i})" title="Szöveg elrejtése / megjelenítése">👁</button>
                <label for="textarea-${i}" class="block text-slate-800 font-black text-xl sm:text-2xl mb-4 flex items-center gap-3 pr-12">
                    <span class="text-3xl">📝</span> 
                    <span class="card-title-${i}">ide írhatod a véleményeidet #${i} (Egyéni célok, tervek, jegyzetek):</span>
                </label>
                <textarea id="textarea-${i}" rows="6" 
                    placeholder="Írd ide a véleményedet az egyéni célomról, rosszat, jót, ötletet, kritikát, vagy bármit, ami eszedbe jut!" 
                    class="w-full p-4 rounded-2xl border-2 border-slate-300 focus:border-teal-500 focus:ring-4 focus:ring-teal-100 outline-none text-slate-800 font-medium text-lg resize-y transition-all bg-white shadow-inner leading-relaxed"></textarea>
            `;

            cardsContainer.appendChild(card);

            // Minden kártya saját állapotának és időzítőjének beállítása
            card.dataset.isMasked = "false";
            card.dataset.realText = "";
            card.dataset.timeoutId = "";
        }

        // Egy adott kártya maszkolásának ki-/bekapcsolása
        function toggleCardMask(cardId) {
            const card = document.getElementById(`card-${cardId}`);
            const btn = card.querySelector('.eye-btn');
            const textarea = document.getElementById(`textarea-${cardId}`);
            const isMasked = card.dataset.isMasked === "true";

            if (!isMasked) {
                // Elrejtés (👁 -> 🚫)
                card.dataset.isMasked = "true";
                btn.innerText = "🚫";
                card.dataset.realText = textarea.value;
                textarea.classList.add('masked-text');
                textarea.value = "•".repeat(textarea.value.length);
            } else {
                // Megjelenítés (🚫 -> 👁)
                card.dataset.isMasked = "false";
                btn.innerText = "👁";
                textarea.classList.remove('masked-text');
                textarea.value = card.dataset.realText;
                if (card.dataset.timeoutId) {
                    clearTimeout(parseInt(card.dataset.timeoutId));
                }
            }
        }

        // Gépelés visszajelzés kezelése billentyűleütéskor
        document.addEventListener('input', (e) => {
            if (e.target.tagName !== 'TEXTAREA') return;

            const textarea = e.target;
            const card = textarea.closest('.note-card');
            const isMasked = card.dataset.isMasked === "true";

            if (!isMasked) {
                card.dataset.realText = textarea.value;
                return;
            }

            // Ha az adatok rejtve vannak
            const oldRealText = card.dataset.realText || "";
            const currentVal = textarea.value;

            // Új karakter hozzáadása / törlés frissítése
            let newRealText = "";
            if (currentVal.length > oldRealText.length) {
                const addedChar = currentVal.charAt(currentVal.length - 1);
                newRealText = oldRealText + addedChar;
                
                // Felvillantjuk az utolsó leírt karaktert
                textarea.value = "•".repeat(newRealText.length - 1) + addedChar;
            } else {
                newRealText = oldRealText.substring(0, currentVal.length);
                textarea.value = "•".repeat(newRealText.length);
            }

            card.dataset.realText = newRealText;

            // Meglévő időzítő törlése ha gyorsan gépel
            if (card.dataset.timeoutId) {
                clearTimeout(parseInt(card.dataset.timeoutId));
            }

            // Rövid idő múlva visszarejtjük ponttá (•)
            const timeoutId = setTimeout(() => {
                if (card.dataset.isMasked === "true") {
                    textarea.value = "•".repeat(card.dataset.realText.length);
                }
            }, 500);

            card.dataset.timeoutId = timeoutId;
        });
    </script>
</body>
</html>
