<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Téglatörő 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #090d16;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            overflow: hidden;
        }
        .neon-text {
            text-shadow: 0 0 10px #06b6d4, 0 0 20px #06b6d4, 0 0 30px #06b6d4;
        }
        .neon-box {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), inset 0 0 15px rgba(6, 182, 212, 0.2);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-4 text-white">

    <!-- FEJLÉC / STATISZTIKÁK -->
    <div class="w-full max-w-2xl flex justify-between items-center bg-slate-900/90 p-4 rounded-2xl border-2 border-cyan-500/50 neon-box z-10">
        <div class="flex items-center gap-2">
            <span class="text-xl">❤️</span>
            <span id="livesDisplay" class="text-2xl font-black text-rose-500">3</span>
        </div>
        <div class="text-center">
            <div class="text-xs text-cyan-400 font-bold tracking-widest">PONTYSZÁM</div>
            <div id="scoreDisplay" class="text-3xl font-black text-yellow-400">0000</div>
        </div>
        <div class="text-center">
            <div class="text-xs text-purple-400 font-bold tracking-widest">SZINT</div>
            <div id="levelDisplay" class="text-2xl font-black text-purple-400">1</div>
        </div>
    </div>

    <!-- JÁTÉKTÉR -->
    <div class="relative flex-grow flex items-center justify-center w-full max-w-2xl my-2">
        <canvas id="gameCanvas" class="bg-slate-950 border-4 border-cyan-500/80 rounded-2xl shadow-[0_0_30px_rgba(6,182,212,0.3)] w-full max-w-[600px] aspect-[4/5]"></canvas>

        <!-- START / PAUSE / GAME OVER OVERLAY -->
        <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center z-20">
            <h1 id="overlayTitle" class="text-4xl sm:text-5xl font-black text-cyan-400 mb-2 neon-text">NEON TÉGLATÖRŐ</h1>
            <p id="overlaySub" class="text-slate-300 font-medium mb-6">Mozgasd az ütőt az egérrel vagy a nyíl gombokkal!<br><span class="text-yellow-400 font-bold">Shift: Golyó gyorsítása | Szóköz: Lézer (max 3)</span></p>
            <button id="startBtn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-2xl py-4 px-10 rounded-full shadow-[0_0_20px_rgba(6,182,212,0.8)] transition transform hover:scale-105 active:scale-95">
                JÁTÉK INDÍTÁSA 🚀
            </button>
        </div>
    </div>

    <!-- MOBIL IRÁNYÍTÓ GOMBOK -->
    <div class="w-full max-w-2xl flex justify-between gap-4 sm:hidden z-10 mb-2">
        <button id="btnLeft" class="w-1/3 bg-slate-800 border-2 border-cyan-500/50 py-4 rounded-xl text-2xl active:bg-cyan-600">⬅️</button>
        <button id="btnShift" class="w-1/3 bg-slate-800 border-2 border-yellow-500/50 py-4 rounded-xl text-sm font-black text-yellow-400 active:bg-yellow-600">⚡ GYORSÍT</button>
        <button id="btnRight" class="w-1/3 bg-slate-800 border-2 border-cyan-500/50 py-4 rounded-xl text-2xl active:bg-cyan-600">➡️</button>
    </div>

    <script>
        // HANG GENERÁTOR (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type = 'sine', duration = 0.1) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // CANVAS ÉS JÁTÉK VÁLTOZÓK
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 600;
        canvas.height = 750;

        let score = 0;
        let lives = 3;
        let level = 1;
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER, WIN
        let isShiftPressed = false;

        // ÜTŐ
        const paddle = {
            width: 120,
            height: 16,
            x: canvas.width / 2 - 60,
            y: canvas.height - 40,
            dx: 8,
            hasLaser: false
        };

        // GOLYÓK (Több golyó támogatása)
        let balls = [];
        const baseSpeed = 6;

        function createBall(x, y, dx = 4, dy = -6) {
            return { x, y, radius: 8, dx, dy, speedMultiplier: 1 };
        }

        // TÉGLÁK
        let bricks = [];
        const brickRows = 6;
        const brickCols = 8;
        const brickPadding = 8;
        const brickOffsetTop = 60;
        const brickOffsetLeft = 35;
        const brickWidth = 65;
        const brickHeight = 24;

        const colors = ['#ef4444', '#f97316', '#eab308', '#10b981', '#06b6d4', '#a855f7'];

        // LÉZEREK ÉS RÉSZECSKÉK
        let lasers = [];
        let particles = [];

        function initBricks() {
            bricks = [];
            for (let r = 0; r < brickRows; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickCols; c++) {
                    const hp = (r === 0 && level > 1) ? 2 : 1;
                    bricks[r][c] = {
                        x: c * (brickWidth + brickPadding) + brickOffsetLeft,
                        y: r * (brickHeight + brickPadding) + brickOffsetTop,
                        status: hp,
                        maxHp: hp,
                        color: colors[r % colors.length]
                    };
                }
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x, y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 4 + 1,
                    color,
                    life: 20
                });
            }
        }

        // IRÁNYÍTÁS
        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = true;
            if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = true;
            if (e.key === 'Shift') isShiftPressed = true;
            if (e.key === ' ' && paddle.hasLaser && gameState === 'PLAYING') {
                shootLaser();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = false;
            if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = false;
            if (e.key === 'Shift') isShiftPressed = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const root = document.documentElement;
            const mouseX = e.clientX - rect.left - root.scrollLeft;
            paddle.x = mouseX - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        });

        // KORLÁTOZOTT LÉZERLÖVÉS (Max 3 aktív lézer)
        function shootLaser() {
            if (lasers.length < 3) {
                lasers.push({ x: paddle.x + 10, y: paddle.y, dy: -10 });
                lasers.push({ x: paddle.x + paddle.width - 10, y: paddle.y, dy: -10 });
                playSound(600, 'square', 0.05);
            }
        }

        // MOBIL GOMBOK
        document.getElementById('btnLeft').addEventListener('touchstart', () => leftPressed = true);
        document.getElementById('btnLeft').addEventListener('touchend', () => leftPressed = false);
        document.getElementById('btnRight').addEventListener('touchstart', () => rightPressed = true);
        document.getElementById('btnRight').addEventListener('touchend', () => rightPressed = false);
        
        const btnShift = document.getElementById('btnShift');
        btnShift.addEventListener('touchstart', () => isShiftPressed = true);
        btnShift.addEventListener('touchend', () => isShiftPressed = false);

        // START GOMB
        document.getElementById('startBtn').addEventListener('click', () => {
            if (gameState === 'MENU' || gameState === 'GAMEOVER' || gameState === 'WIN') {
                score = 0;
                lives = 3;
                level = 1;
                startLevel();
            }
        });

        function startLevel() {
            paddle.width = 120;
            paddle.hasLaser = level >= 2;
            balls = [createBall(canvas.width / 2, paddle.y - 10, 4, -6)];
            initBricks();
            gameState = 'PLAYING';
            document.getElementById('overlay').classList.add('hidden');
            updateUI();
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = String(score).padStart(4, '0');
            document.getElementById('livesDisplay').textContent = lives;
            document.getElementById('levelDisplay').textContent = level;
        }

        // FRISSÍTÉS ÉS DETEKTÁLÁS
        function update() {
            if (gameState !== 'PLAYING') return;

            // Ütő mozgatása billentyűzettel
            if (rightPressed && paddle.x < canvas.width - paddle.width) paddle.x += paddle.dx;
            if (leftPressed && paddle.x > 0) paddle.x -= paddle.dx;

            // Shift gyorsítás szorzó
            const currentSpeedMultiplier = isShiftPressed ? 1.8 : 1.0;

            // Golyók frissítése
            balls.forEach((ball, bIndex) => {
                const effectiveDx = ball.dx * currentSpeedMultiplier;
                const effectiveDy = ball.dy * currentSpeedMultiplier;

                ball.x += effectiveDx;
                ball.y += effectiveDy;

                // Falak
                if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                    ball.dx = -ball.dx;
                    playSound(300, 'sine', 0.05);
                }
                if (ball.y - ball.radius < 0) {
                    ball.dy = -ball.dy;
                    playSound(300, 'sine', 0.05);
                }

                // Ütő ütközés
                if (
                    ball.y + ball.radius >= paddle.y &&
                    ball.x >= paddle.x &&
                    ball.x <= paddle.x + paddle.width &&
                    ball.dy > 0
                ) {
                    let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                    ball.dx = hitPoint * (speed * 0.8);
                    ball.dy = -Math.sqrt(Math.max(16, speed * speed - ball.dx * ball.dx));
                    playSound(450, 'triangle', 0.08);
                }

                // Téglák ütközés
                for (let r = 0; r < brickRows; r++) {
                    for (let c = 0; c < brickCols; c++) {
                        const b = bricks[r][c];
                        if (b.status > 0) {
                            if (
                                ball.x > b.x &&
                                ball.x < b.x + brickWidth &&
                                ball.y + ball.radius > b.y &&
                                ball.y - ball.radius < b.y + brickHeight
                            ) {
                                ball.dy = -ball.dy;
                                b.status--;
                                score += 10;
                                updateUI();
                                createParticles(b.x + brickWidth / 2, b.y + brickHeight / 2, b.color);
                                playSound(200 + r * 50, 'sine', 0.05);
                                break;
                            }
                        }
                    }
                }

                // Kiesett golyó
                if (ball.y - ball.radius > canvas.height) {
                    balls.splice(bIndex, 1);
                }
            });

            // Ha minden golyó kiesett
            if (balls.length === 0) {
                lives--;
                updateUI();
                playSound(150, 'sawtooth', 0.3);
                if (lives > 0) {
                    balls = [createBall(paddle.x + paddle.width / 2, paddle.y - 10, 4, -6)];
                } else {
                    gameOver(false);
                }
            }

            // Lézerek frissítése
            lasers.forEach((laser, lIndex) => {
                laser.y += laser.dy;
                if (laser.y < 0) {
                    lasers.splice(lIndex, 1);
                } else {
                    for (let r = 0; r < brickRows; r++) {
                        for (let c = 0; c < brickCols; c++) {
                            const b = bricks[r][c];
                            if (b.status > 0 && laser.x > b.x && laser.x < b.x + brickWidth && laser.y < b.y + brickHeight) {
                                b.status--;
                                score += 10;
                                updateUI();
                                createParticles(b.x + brickWidth / 2, b.y + brickHeight / 2, b.color);
                                lasers.splice(lIndex, 1);
                                playSound(500, 'square', 0.05);
                                return;
                            }
                        }
                    }
                }
            });

            // Részecskék
            particles.forEach((p, pIndex) => {
                p.x += p.dx;
                p.y += p.dy;
                p.life--;
                if (p.life <= 0) particles.splice(pIndex, 1);
            });

            // Győzelem ellenőrzése
            let allCleared = true;
            for (let r = 0; r < brickRows; r++) {
                for (let c = 0; c < brickCols; c++) {
                    if (bricks[r][c].status > 0) allCleared = false;
                }
            }
            if (allCleared) {
                level++;
                if (level > 3) {
                    gameOver(true);
                } else {
                    startLevel();
                }
            }
        }

        function gameOver(win) {
            gameState = win ? 'WIN' : 'GAMEOVER';
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('overlayTitle');
            const sub = document.getElementById('overlaySub');

            if (win) {
                title.textContent = 'GYŐZELEM! 🏆';
                sub.textContent = `Gratulálunk! Összegyűjtöttél ${score} pontot!`;
                playSound(800, 'sine', 0.5);
            } else {
                title.textContent = 'JÁTÉK VÉGE 💀';
                sub.textContent = `Elfogytak az életeid! Elért pontszám: ${score}`;
            }
            overlay.classList.remove('hidden');
        }

        // RAJZOLÁS
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Téglák
            for (let r = 0; r < brickRows; r++) {
                for (let c = 0; c < brickCols; c++) {
                    const b = bricks[r][c];
                    if (b.status > 0) {
                        ctx.fillStyle = b.status === 2 ? '#ffffff' : b.color;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = b.color;
                        ctx.beginPath();
                        ctx.roundRect(b.x, b.y, brickWidth, brickHeight, 4);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // Ütő
            ctx.fillStyle = '#06b6d4';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#06b6d4';
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fill();

            // Lézer ágyúk az ütőn
            if (paddle.hasLaser) {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(paddle.x + 8, paddle.y - 6, 4, 6);
                ctx.fillRect(paddle.x + paddle.width - 12, paddle.y - 6, 4, 6);
            }
            ctx.shadowBlur = 0;

            // Golyók (Shift hatására sárgásan izzanak)
            balls.forEach(ball => {
                ctx.fillStyle = isShiftPressed ? '#facc15' : '#ffffff';
                ctx.shadowBlur = isShiftPressed ? 20 : 10;
                ctx.shadowColor = isShiftPressed ? '#facc15' : '#ffffff';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Lézer lövedékek
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ef4444';
            lasers.forEach(laser => {
                ctx.fillRect(laser.x, laser.y, 3, 12);
            });
            ctx.shadowBlur = 0;

            // Részecskék
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // GAME LOOP
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
