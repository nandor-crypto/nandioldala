<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Szerencsekerék</title>
<style>
body {
    font-family: Arial;
    margin: 0;
    text-align: center;
    background: white;
}

#setup {
    padding: 20px;
}

input {
    display: block;
    margin: 8px auto;
    padding: 8px;
    width: 200px;
}

button {
    margin: 10px;
    padding: 10px 20px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
}

#addBtn { background: #ddd; }
#readyBtn { background: #2196f3; color: white; }
#spinBtn { background: orange; color: white; display:none; }
#resetBtn { background: green; color: white; display:none; }

#game {
    display: none;
    position: relative;
}

canvas {
    margin-top: 20px;
    background: white;
}

#pointer {
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-bottom: 30px solid white;
    margin: 0 auto;
    position: relative;
    top: 20px;
    z-index: 2;
    filter: drop-shadow(0 0 2px black);
}

#overlay {
    position: fixed;
    top: 0;
    left: 0;
    right:0;
    bottom:0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 40px;
    flex-direction: column;
}

#closeX {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 30px;
    cursor: pointer;
    display: none;
}
</style>
</head>
<body>

<div id="setup">
    <div id="inputs">
        <input placeholder="Írj egy szót">
    </div>
    <button id="addBtn">+</button>
    <br>
    <button id="readyBtn">Kész</button>
</div>

<div id="game">
    <div id="pointer"></div>
    <canvas id="wheel" width="400" height="400"></canvas>
    <br>
    <button id="spinBtn">Pörgetés</button>
    <button id="resetBtn">Újat akarok kezdeni</button>
</div>

<div id="overlay">
    <div id="closeX">X</div>
    <div id="resultText"></div>
</div>

<script>
const inputs = document.getElementById("inputs");
const addBtn = document.getElementById("addBtn");
const readyBtn = document.getElementById("readyBtn");
const spinBtn = document.getElementById("spinBtn");
const resetBtn = document.getElementById("resetBtn");

const setup = document.getElementById("setup");
const game = document.getElementById("game");

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const overlay = document.getElementById("overlay");
const resultText = document.getElementById("resultText");
const closeX = document.getElementById("closeX");

let words = [];
let angle = 0;
let spinning = false;

addBtn.onclick = () => {
    const input = document.createElement("input");
    input.placeholder = "Írj egy szót";
    inputs.appendChild(input);
};

readyBtn.onclick = () => {
    words = [...document.querySelectorAll("input")]
        .map(i => i.value)
        .filter(v => v.trim() !== "");

    if (words.length < 2) {
        alert("Adj meg legalább 2 szót!");
        return;
    }

    setup.style.display = "none";
    game.style.display = "block";
    spinBtn.style.display = "inline-block";
    resetBtn.style.display = "inline-block";

    drawWheel();
};

function drawWheel() {
    const n = words.length;
    const arc = (2 * Math.PI) / n;

    ctx.clearRect(0, 0, 400, 400);

    for (let i = 0; i < n; i++) {
        ctx.beginPath();
        ctx.fillStyle = `hsl(${i * 360 / n}, 70%, 60%)`;
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 200, arc * i + angle, arc * (i + 1) + angle);
        ctx.fill();
        ctx.save();

        ctx.translate(200, 200);
        ctx.rotate(arc * i + arc / 2 + angle);
        ctx.textAlign = "right";
        ctx.fillStyle = "black";
        ctx.font = "16px Arial";
        ctx.fillText(words[i], 180, 5);
        ctx.restore();
    }
}

function spin() {
    if (spinning) return;
    spinning = true;

    let speed = Math.random() * 0.3 + 0.3;
    let decel = 0.995;

    const targetIndex = Math.floor(Math.random() * words.length);

    const interval = setInterval(() => {
        angle += speed;
        speed *= decel;

        drawWheel();

        if (speed < 0.002) {
            clearInterval(interval);
            spinning = false;
            showResult(targetIndex);
        }
    }, 16);
}

function showResult(index) {
    document.body.style.background = "#ccc";
    resultText.innerText = words[index];
    overlay.style.display = "flex";
    closeX.style.display = "block";

    // villogás
    let count = 0;
    const blink = setInterval(() => {
        document.getElementById("pointer").style.opacity =
            document.getElementById("pointer").style.opacity == "0" ? "1" : "0";
        count++;
        if (count > 4) {
            clearInterval(blink);
            document.getElementById("pointer").style.opacity = "1";
        }
    }, 200);
}

closeX.onclick = () => {
    overlay.style.display = "none";
};

resetBtn.onclick = () => {
    location.reload();
};

spinBtn.onclick = spin;
</script>

</body>
  </html>
