<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kapunyitó</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
height:100vh;
background:#eeeeee;
display:flex;
justify-content:center;
align-items:center;
}


/* jobb felső sarok */

#profilTerulet{
position:fixed;
top:0;
right:0;
width:80px;
height:80px;
}


#profil{
position:absolute;
top:15px;
right:15px;
font-size:40px;
cursor:pointer;
}


/* menü */

#menu{
display:none;
position:absolute;
top:65px;
right:10px;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 0 10px #777;
}


#menu div{
padding:15px 30px;
cursor:pointer;
}


#menu div:hover{
background:#ddd;
}



/* oldalak */

.oldal{
text-align:center;
}



button{

width:230px;
height:70px;
margin:10px;

border:none;
border-radius:12px;

font-size:22px;
color:white;

cursor:pointer;

}


#teljes{
background:#006cff;
}


#kis{
background:#16a33a;
}


#koszonet{

display:none;

font-size:30px;
color:green;

margin-top:20px;

}


#uzenet{

display:none;

font-size:28px;
color:red;

}

</style>

</head>

<body>


<div id="profilTerulet">

<div id="profil">
👤
</div>


<div id="menu">

<div onclick="vevo()">
Vevő
</div>


<div onclick="iranyito()">
Irányító
</div>


</div>

</div>



<div id="vevoOldal" class="oldal">

<h1>Vevő</h1>


<button id="teljes">
Teljes nyitás
</button>


<br>


<button id="kis">
Kis nyitás
</button>


<div id="koszonet">
Köszönjük!
</div>


</div>



<div id="iranyitoOldal" class="oldal" style="display:none">

<h1>Irányító</h1>

<div id="uzenet"></div>

</div>
<script>

const profil = document.getElementById("profil");
const menu = document.getElementById("menu");
const profilTerulet = document.getElementById("profilTerulet");

let elrejto;


// profil megnyitja a menüt

profil.onclick = function(e){

    e.stopPropagation();

    if(menu.style.display === "block"){
        menu.style.display="none";
    }
    else{
        menu.style.display="block";
    }

};



// 3 másodperc után eltűnik

function profilElrejt(){

    clearTimeout(elrejto);

    elrejto=setTimeout(function(){

        profil.style.display="none";

    },3000);

}


profilElrejt();



// a jobb felső területre kattintva visszajön

profilTerulet.onclick=function(){

    profil.style.display="block";

    profilElrejt();

};




// ha máshova kattintunk, a menü bezár

document.body.onclick=function(){

    menu.style.display="none";

};




// Vevő mód

function vevo(){

    menu.style.display="none";

    document.getElementById("vevoOldal").style.display="block";

    document.getElementById("iranyitoOldal").style.display="none";

}



// Irányító mód

function iranyito(){

    menu.style.display="none";

    document.getElementById("vevoOldal").style.display="none";

    document.getElementById("iranyitoOldal").style.display="block";

    ellenorzes();

}




// teljes nyitás

document.getElementById("teljes").onclick=function(){

    kuldes("Teljes nyitás");

};



// kis nyitás

document.getElementById("kis").onclick=function(){

    kuldes("Kis nyitás");

};




// kérés mentése

function kuldes(szoveg){

    localStorage.setItem(
        "kapuKeres",
        szoveg
    );


    let koszonet =
    document.getElementById("koszonet");


    koszonet.style.display="block";


    setTimeout(function(){

        koszonet.style.display="none";

    },3000);

}




// irányító üzenet

function ellenorzes(){

    let keres =
    localStorage.getItem("kapuKeres");


    if(keres){

        let uzenet =
        document.getElementById("uzenet");


        uzenet.innerHTML =
        "🔔 " + keres + " kérve";


        uzenet.style.display="block";

    }

}


</script>

</body>
    </html>
