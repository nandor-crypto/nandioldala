<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kapunyitó</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    margin:0;
    height:100vh;
    background:#eeeeee;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* profil */

#profilTerulet{
    position:fixed;
    top:0;
    right:0;
    width:90px;
    height:90px;
}


#profil{
    font-size:40px;
    position:absolute;
    top:15px;
    right:15px;
    cursor:pointer;
}



/* menü */

#menu{
    display:none;
    position:absolute;
    top:65px;
    right:10px;

    background:white;
    border-radius:10px;
    box-shadow:0 0 10px #777;
    overflow:hidden;
}


#menu div{
    padding:15px 30px;
    cursor:pointer;
}


#menu div:hover{
    background:#ddd;
}



/* oldalak */

.oldal{
    text-align:center;
}



button{

    width:230px;
    height:70px;

    margin:10px;

    border:0;
    border-radius:12px;

    color:white;

    font-size:22px;

    cursor:pointer;

}


#teljes{
    background:#006cff;
}


#kis{
    background:#18a83b;
}



#koszonet{

    display:none;

    margin-top:20px;

    font-size:30px;

    color:green;

}



#uzenet{

    display:none;

    font-size:28px;

    color:red;

}


</style>

</head>


<body>


<div id="profilTerulet">

    <div id="profil">
        👤
    </div>


    <div id="menu">

        <div onclick="vevo()">
            Vevő
        </div>


        <div onclick="iranyito()">
            Irányító
        </div>

    </div>

</div>



<div id="vevoOldal" class="oldal">

<h1>Vevő</h1>


<button id="teljes">
Teljes nyitás
</button>


<br>


<button id="kis">
Kis nyitás
</button>


<div id="koszonet">
Köszönjük!
</div>


</div>




<div id="iranyitoOldal" class="oldal" style="display:none">

<h1>Irányító</h1>

<div id="uzenet"></div>

</div>


<audio id="csengo">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>
<script>

const profil = document.getElementById("profil");
const profilTerulet = document.getElementById("profilTerulet");
const menu = document.getElementById("menu");

let timer;


// 👤 profil megnyitja a menüt

profil.onclick = function(e){

    e.stopPropagation();

    if(menu.style.display === "block"){
        menu.style.display="none";
    }
    else{
        menu.style.display="block";
    }

};



// profil 3 másodperc után eltűnik

function profilIndit(){

    clearTimeout(timer);

    timer=setTimeout(function(){

        profil.style.display="none";

    },3000);

}


profilIndit();



// jobb felső sarokra kattintva visszajön

profilTerulet.onclick=function(e){

    if(e.target === profilTerulet){

        profil.style.display="block";

        profilIndit();

    }

};



// menü bezárása máshova kattintva

document.body.onclick=function(){

    menu.style.display="none";

};



// VEVO

function vevo(){

    menu.style.display="none";

    document.getElementById("vevoOldal").style.display="block";

    document.getElementById("iranyitoOldal").style.display="none";

}




// IRANYITO

function iranyito(){

    menu.style.display="none";

    document.getElementById("vevoOldal").style.display="none";

    document.getElementById("iranyitoOldal").style.display="block";

    ellenorzes();

}




// teljes nyitás gomb

document.getElementById("teljes").onclick=function(){

    kuldes("Teljes nyitás");

};




// kis nyitás gomb

document.getElementById("kis").onclick=function(){

    kuldes("Kis nyitás");

};





// kérés mentése

function kuldes(tipus){


    localStorage.setItem(
        "kapuKeres",
        tipus
    );


    let koszonet =
    document.getElementById("koszonet");


    koszonet.style.display="block";


    setTimeout(function(){

        koszonet.style.display="none";

    },3000);


}






// irányító üzenet

function ellenorzes(){


    let keres =
    localStorage.getItem("kapuKeres");


    if(keres){


        let uzenet =
        document.getElementById("uzenet");


        uzenet.innerHTML =
        "🔔 " + keres + " kérve";


        uzenet.style.display="block";


        let hang =
        document.getElementById("csengo");


        hang.play();

    }

}


</script>


</body>
</html>
