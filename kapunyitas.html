<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kapunyitó</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    height:100vh;
    background:#f1f1f1;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* Profil */

#profilBox{
    position:fixed;
    top:15px;
    right:15px;
}


#profil{
    font-size:40px;
    cursor:pointer;
}


/* Menü */

#menu{
    display:none;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px #777;
}


#menu div{
    padding:15px 35px;
    cursor:pointer;
}


#menu div:hover{
    background:#ddd;
}


/* Oldalak */

.oldal{
    text-align:center;
}


button{

    width:230px;
    height:70px;
    margin:10px;

    border:0;
    border-radius:12px;

    color:white;
    font-size:22px;

    cursor:pointer;
}


#teljes{
    background:#006cff;
}


#kis{
    background:#19a83a;
}


#koszonet{

    display:none;

    color:green;
    font-size:30px;

    margin-top:20px;
}


#uzenet{

    display:none;

    color:red;
    font-size:28px;

}


</style>

</head>


<body>


<div id="profilBox">

    <div id="profil">
        👤
    </div>


    <div id="menu">

        <div onclick="vevo()">
            Vevő
        </div>


        <div onclick="iranyito()">
            Irányító
        </div>

    </div>

</div>



<div id="vevoOldal" class="oldal">

<h1>Vevő</h1>


<button id="teljes">
Teljes nyitás
</button>


<br>


<button id="kis">
Kis nyitás
</button>


<div id="koszonet">
Köszönjük!
</div>


</div>




<div id="iranyitoOldal" class="oldal" style="display:none">


<h1>Irányító</h1>


<div id="uzenet">

</div>


</div>
<script>

// elemek

const profil = document.getElementById("profil");
const menu = document.getElementById("menu");


// csengő hang

const csengo = new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);



// profil menü megnyitása

profil.onclick = function(){

    if(menu.style.display === "block"){
        menu.style.display="none";
    }
    else{
        menu.style.display="block";
    }

};



// profil ikon 3 másodperc után eltűnik

setTimeout(function(){

    profil.style.display="none";

},3000);



// jobb felső sarok érintésére visszajön

document.getElementById("profilBox").onclick=function(){

    profil.style.display="block";

    clearTimeout(window.elrejtes);

    window.elrejtes=setTimeout(function(){

        profil.style.display="none";

    },3000);

};




// Vevő oldal

function vevo(){

    menu.style.display="none";

    document.getElementById("vevoOldal").style.display="block";

    document.getElementById("iranyitoOldal").style.display="none";

}



// Irányító oldal

function iranyito(){

    menu.style.display="none";

    document.getElementById("vevoOldal").style.display="none";

    document.getElementById("iranyitoOldal").style.display="block";

}



// gombok

document.getElementById("teljes").onclick=function(){

    kuldes("Teljes nyitás");

};



document.getElementById("kis").onclick=function(){

    kuldes("Kis nyitás");

};




// kérés elküldése

function kuldes(tipus){


    localStorage.setItem(
        "kapuUzenet",
        tipus
    );


    let koszonet =
    document.getElementById("koszonet");


    koszonet.style.display="block";


    setTimeout(function(){

        koszonet.style.display="none";

    },3000);


}



// irányító üzenet megjelenítése

function ellenorzes(){


    let adat =
    localStorage.getItem("kapuUzenet");


    if(adat){


        let uzenet =
        document.getElementById("uzenet");


        uzenet.innerHTML =
        "🔔 " + adat + " kérve";


        uzenet.style.display="block";


        csengo.play();


    }

}


// amikor irányító módba lép,
// rögtön ellenőriz

const regiIranyito = iranyito;

iranyito = function(){

    regiIranyito();

    ellenorzes();

};


</script>

</body>
</html>
