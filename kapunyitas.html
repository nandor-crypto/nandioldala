<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kapunyitó</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    height:100vh;
    background:#eeeeee;
    display:flex;
    justify-content:center;
    align-items:center;
}


#profilBox{
    position:fixed;
    top:15px;
    right:15px;
}


#profil{
    font-size:40px;
    cursor:pointer;
    user-select:none;
}


#menu{
    display:none;
    background:white;
    margin-top:10px;
    border-radius:10px;
    box-shadow:0 0 10px #777;
    overflow:hidden;
}


#menu div{
    padding:15px 35px;
    cursor:pointer;
}


#menu div:hover{
    background:#ddd;
}


.oldal{
    text-align:center;
}


button{
    width:230px;
    height:70px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:22px;
    cursor:pointer;
    margin:10px;
}


#teljes{
    background:#006cff;
}


#kis{
    background:#18a83a;
}


#koszonet{
    display:none;
    font-size:30px;
    color:green;
    margin-top:20px;
}


#ertesites{
    display:none;
    font-size:28px;
    color:red;
}

</style>

</head>

<body>


<div id="profilBox">

    <div id="profil">
        👤
    </div>


    <div id="menu">

        <div onclick="vevo()">
            Vevő
        </div>

        <div onclick="iranyito()">
            Irányító
        </div>

    </div>

</div>


<div id="vevoOldal" class="oldal">

    <h1>Vevő</h1>

    <button id="teljes">
        Teljes nyitás
    </button>

    <br>

    <button id="kis">
        Kis nyitás
    </button>

    <div id="koszonet">
        Köszönjük!
    </div>

</div>


<div id="iranyitoOldal" class="oldal" style="display:none">

    <h1>Irányító</h1>

    <div id="ertesites"></div>

          </div>
          <script>

// Profil ikon és menü

const profil = document.getElementById("profil");
const menu = document.getElementById("menu");


// profil kattintás

profil.onclick = function(){

    if(menu.style.display === "block"){
        menu.style.display="none";
    }else{
        menu.style.display="block";
    }

};



// 3 másodperc után eltűnik

setTimeout(function(){

    profil.style.display="none";

},3000);



// jobb felső sarokra kattintva visszajön

document.getElementById("profilBox").onclick=function(){

    profil.style.display="block";


    clearTimeout(window.profilTimer);


    window.profilTimer=setTimeout(function(){

        profil.style.display="none";

    },3000);

};




// Vevő mód

function vevo(){

    menu.style.display="none";

    document.getElementById("vevoOldal").style.display="block";

    document.getElementById("iranyitoOldal").style.display="none";

}




// Irányító mód

function iranyito(){

    menu.style.display="none";

    document.getElementById("vevoOldal").style.display="none";

    document.getElementById("iranyitoOldal").style.display="block";

}



// Vevő gombok

document.getElementById("teljes").onclick=function(){

    kuldes("Teljes nyitás");

};



document.getElementById("kis").onclick=function(){

    kuldes("Kis nyitás");

};



// kérés mentése

function kuldes(szoveg){


    localStorage.setItem(
        "kapuKeres",
        szoveg
    );


    let koszonet =
    document.getElementById("koszonet");


    koszonet.style.display="block";


    setTimeout(function(){

        koszonet.style.display="none";

    },3000);

}



// irányító ellenőrzés

function ellenorzes(){


    let keres =
    localStorage.getItem("kapuKeres");


    if(keres){


        let uzenet =
        document.getElementById("ertesites");


        uzenet.innerHTML =
        keres + " kérve";


        uzenet.style.display="block";

    }

}

  </script>
